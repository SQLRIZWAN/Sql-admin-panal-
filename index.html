<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>SQL MASTER ADMIN | STABLE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        :root {
            --accent: #00ff88;
            --gold: #ffd700;
            --bg: #050505;
            --card: #111;
            --red: #ff4444;
        }

        /* Layout Fixes to prevent zoom and instability */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; touch-action: manipulation; }
        
        header { background: #000; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 1000; }
        header h2 { margin: 0; font-size: 1.1rem; color: var(--gold); letter-spacing: 1px; }

        .wrap { padding: 15px; width: 100%; max-width: 600px; margin: 0 auto; }
        
        /* Dashboard Cards */
        .card { background: var(--card); padding: 18px; border-radius: 15px; border: 1px solid #222; margin-bottom: 15px; }
        .card h3 { margin: 0 0 15px 0; color: var(--accent); font-size: 0.9rem; display: flex; justify-content: space-between; }

        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .field { display: flex; flex-direction: column; margin-bottom: 10px; }
        label { font-size: 0.65rem; color: #888; text-transform: uppercase; margin-bottom: 4px; font-weight: bold; }
        
        input, select { background: #000; border: 1px solid #333; color: var(--accent); padding: 12px; border-radius: 8px; font-size: 0.9rem; outline: none; width: 100%; }
        input:focus { border-color: var(--accent); }

        /* Timer/Date Input Specific */
        input[type="datetime-local"] { color-scheme: dark; font-family: sans-serif; }

        button { padding: 14px; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .btn-save { background: var(--accent); color: #000; width: 100%; margin-top: 10px; }
        
        /* Payment Tabs UI */
        .tab-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; background: #1a1a1a; color: #888; border: 1px solid #333; padding: 10px; border-radius: 8px; font-size: 0.8rem; }
        .tab-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }

        .pay-card { border-left: 4px solid var(--gold); }
        .utr-box { background: #000; padding: 10px; border-radius: 5px; margin: 10px 0; border: 1px dashed #444; }
        .utr-box span { color: var(--gold); font-family: monospace; font-size: 1.1rem; }

        .action-btns { display: flex; gap: 10px; margin-top: 15px; }
        .btn-approve { background: var(--accent); color: #000; flex: 1; }
        .btn-reject { background: var(--red); color: #fff; flex: 1; }

        /* Navigation Menu */
        #menu-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; }
        .menu-content { position: absolute; right: 0; width: 260px; height: 100%; background: #0d0d0d; border-left: 2px solid var(--gold); padding: 50px 20px; }
        .menu-item { display: block; width: 100%; padding: 15px; color: #fff; text-decoration: none; background: #1a1a1a; margin-bottom: 10px; border-radius: 8px; text-align: left; }
    </style>
</head>
<body>

    <header>
        <h2><i class="fas fa-user-shield"></i> SQL CONTROL PANEL</h2>
        <div onclick="openMenu()"><i class="fas fa-bars" style="color:var(--gold); font-size:1.4rem;"></i></div>
    </header>

    <div id="menu-overlay" onclick="closeMenu()">
        <div class="menu-content" onclick="event.stopPropagation()">
            <button class="menu-item" onclick="showSection('matches')"><i class="fas fa-gamepad"></i> Matches</button>
            <button class="menu-item" onclick="showSection('payments')"><i class="fas fa-wallet"></i> Payments</button>
            <button class="menu-item" onclick="logout()" style="background:var(--red); margin-top:50px;">Logout</button>
        </div>
    </div>

    <div id="login-area" class="wrap" style="display:none; text-align:center; margin-top:100px;">
        <div class="card">
            <h3>ADMIN LOGIN</h3>
            <input type="email" id="adm-email" placeholder="Email" style="margin-bottom:10px;">
            <input type="password" id="adm-pass" placeholder="Password">
            <button class="btn-save" onclick="login()">ENTER PANEL</button>
        </div>
    </div>

    <div id="matches-sec" class="wrap">
        <h3 style="color:var(--gold);"><i class="fas fa-plus-circle"></i> MANAGE MATCHES</h3>
        <div id="matches-list"></div>
    </div>

    <div id="payments-sec" class="wrap" style="display:none">
        <h3 style="color:var(--gold);"><i class="fas fa-history"></i> VERIFY PAYMENTS</h3>
        
        <div class="tab-container">
            <button id="tab-new" class="tab-btn active" onclick="switchPayTab('new')">NEW REQUESTS</button>
            <button id="tab-history" class="tab-btn" onclick="switchPayTab('history')">HISTORY</button>
        </div>

        <div id="payments-list"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvObxADcAior6R_or9O6UmWsFT8do1GkI",
            authDomain: "sqladmin-ff04d.firebaseapp.com",
            projectId: "sqladmin-ff04d",
            storageBucket: "sqladmin-ff04d.firebasestorage.app",
            messagingSenderId: "539086978850",
            appId: "1:539086978850:web:261e6a0cf3c9a2aa29ef7b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentPayTab = 'new';

        // --- AUTH ---
        onAuthStateChanged(auth, user => {
            if (user) {
                document.getElementById('login-area').style.display = 'none';
                document.getElementById('matches-sec').style.display = 'block';
                initData();
            } else {
                document.getElementById('login-area').style.display = 'block';
                document.getElementById('matches-sec').style.display = 'none';
                document.getElementById('payments-sec').style.display = 'none';
            }
        });

        window.login = () => {
            const e = document.getElementById('adm-email').value;
            const p = document.getElementById('adm-pass').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => alert("Wrong Admin Details"));
        };

        window.logout = () => signOut(auth);

        // --- MATCHES ---
        function initData() {
            // Load Matches
            onSnapshot(collection(db, "matches"), snap => {
                const list = document.getElementById('matches-list');
                list.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    const id = d.id;
                    // Format time for input
                    let timeStr = "";
                    if(m.startTime) {
                        const date = new Date(m.startTime);
                        timeStr = date.toISOString().slice(0, 16);
                    }

                    list.innerHTML += `
                    <div class="card">
                        <h3>ID: ${id.substring(0,8)} <span style="font-size:0.7rem; color:#555;">${m.status}</span></h3>
                        <div class="grid-form">
                            <div class="field"><label>Map Name</label><input id="map-${id}" value="${m.map}"></div>
                            <div class="field"><label>Type (Solo/Duo)</label><input id="type-${id}" value="${m.type}"></div>
                            <div class="field"><label>Entry Fee</label><input type="number" id="fee-${id}" value="${m.entry}"></div>
                            <div class="field"><label>Win Prize</label><input type="number" id="win-${id}" value="${m.win}"></div>
                            <div class="field"><label>Joined</label><input type="number" id="joined-${id}" value="${m.joined}"></div>
                            <div class="field"><label>Total Slots</label><input type="number" id="total-${id}" value="${m.total}"></div>
                            <div class="field"><label>Status</label>
                                <select id="status-${id}">
                                    <option value="open" ${m.status=='open'?'selected':''}>Open</option>
                                    <option value="full" ${m.status=='full'?'selected':''}>Full</option>
                                    <option value="started" ${m.status=='started'?'selected':''}>Started</option>
                                </select>
                            </div>
                            <div class="field"><label>Match Start Time</label>
                                <input type="datetime-local" id="time-${id}" value="${timeStr}">
                            </div>
                        </div>
                        <div class="field" style="margin-top:10px;"><label>Room ID</label><input id="rid-${id}" value="${m.roomId || ''}"></div>
                        <div class="field"><label>Room Password</label><input id="rps-${id}" value="${m.password || ''}"></div>
                        <button class="btn-save" onclick="updateMatch('${id}')">UPDATE MATCH DATA</button>
                    </div>`;
                });
            });

            // Load Payments
            loadPayments();
        }

        window.updateMatch = async (id) => {
            const timeVal = document.getElementById(`time-${id}`).value;
            const startTimeStamp = timeVal ? new Date(timeVal).getTime() : 0;

            await updateDoc(doc(db, "matches", id), {
                map: document.getElementById(`map-${id}`).value,
                type: document.getElementById(`type-${id}`).value,
                entry: Number(document.getElementById(`fee-${id}`).value),
                win: Number(document.getElementById(`win-${id}`).value),
                joined: Number(document.getElementById(`joined-${id}`).value),
                total: Number(document.getElementById(`total-${id}`).value),
                status: document.getElementById(`status-${id}`).value,
                roomId: document.getElementById(`rid-${id}`).value,
                password: document.getElementById(`rps-${id}`).value,
                startTime: startTimeStamp
            });
            alert("Match Updated Successfully!");
        };

        // --- PAYMENTS ---
        function loadPayments() {
            onSnapshot(collection(db, "payments"), snap => {
                const list = document.getElementById('payments-list');
                list.innerHTML = "";
                snap.forEach(d => {
                    const p = d.data();
                    const id = d.id;

                    // Filter Logic for New vs History
                    if(currentPayTab === 'new' && p.status !== 'pending') return;
                    if(currentPayTab === 'history' && p.status === 'pending') return;

                    const statusColor = p.status === 'approved' ? 'var(--accent)' : (p.status === 'rejected' ? 'var(--red)' : 'var(--gold)');

                    list.innerHTML += `
                    <div class="card pay-card" style="border-left-color: ${statusColor}">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <div>
                                <label>Match Target</label>
                                <div style="font-size:0.8rem; margin-bottom:5px;">${p.matchId}</div>
                            </div>
                            <span style="font-size:0.6rem; background:#222; padding:3px 8px; border-radius:4px; color:${statusColor}">
                                ${p.status.toUpperCase()}
                            </span>
                        </div>
                        <div class="utr-box">
                            <label>UTR Number</label><br>
                            <span>${p.utr}</span>
                        </div>
                        ${p.status === 'pending' ? `
                            <div class="action-btns">
                                <button class="btn-approve" onclick="handlePay('${id}', 'approved')">APPROVE</button>
                                <button class="btn-reject" onclick="handlePay('${id}', 'rejected')">REJECT</button>
                            </div>
                        ` : `<div style="font-size:0.7rem; color:#555; text-align:right;">Processed on: ${new Date(p.timestamp).toLocaleString()}</div>`}
                    </div>`;
                });
            });
        }

        window.handlePay = async (id, stat) => {
            await updateDoc(doc(db, "payments", id), { 
                status: stat,
                processedAt: Date.now()
            });
        };

        window.switchPayTab = (tab) => {
            currentPayTab = tab;
            document.getElementById('tab-new').classList.toggle('active', tab === 'new');
            document.getElementById('tab-history').classList.toggle('active', tab === 'history');
            loadPayments();
        };

        // --- UI HELPERS ---
        window.openMenu = () => document.getElementById('menu-overlay').style.display = 'block';
        window.closeMenu = () => document.getElementById('menu-overlay').style.display = 'none';
        window.showSection = (sec) => {
            document.getElementById('matches-sec').style.display = sec === 'matches' ? 'block' : 'none';
            document.getElementById('payments-sec').style.display = sec === 'payments' ? 'block' : 'none';
            closeMenu();
        };

    </script>
</body>
</html>

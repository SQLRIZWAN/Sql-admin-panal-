<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SQL Admin Panel (Fixed)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBvObxADcAior6R_or9O6UmWsFT8do1GkI",
      authDomain: "sqladmin-ff04d.firebaseapp.com",
      projectId: "sqladmin-ff04d",
      storageBucket: "sqladmin-ff04d.firebasestorage.app",
      messagingSenderId: "539086978850",
      appId: "1:539086978850:web:261e6a0cf3c9a2aa29ef7b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.loginAdmin = async () => {
      await signInWithEmailAndPassword(auth, email.value, pass.value);
    };

    window.logout = async () => {
      await signOut(auth);
    };

    onAuthStateChanged(auth, u => {
      login.style.display = u ? 'none' : 'block';
      panel.style.display = u ? 'block' : 'none';
      if (u) loadMatches();
    });

    async function loadMatches() {
      matches.innerHTML = "";
      const snap = await getDocs(collection(db, "matches"));
      snap.forEach(d => {
        const m = d.data();
        matches.innerHTML += `
          <div class="card">
            <h3>${m.type}</h3>
            Entry <input id="e-${d.id}" value="${m.entry}" />
            Win <input id="w-${d.id}" value="${m.win}" />
            Status <input id="s-${d.id}" value="${m.status}" />
            Room ID <input id="r-${d.id}" value="${m.roomId || ''}" />
            Password <input id="p-${d.id}" value="${m.password || ''}" />
            <button onclick="save('${d.id}')">Update Match</button>
          </div>`;
      });
    }

    window.save = async id => {
      await updateDoc(doc(db, "matches", id), {
        entry: Number(document.getElementById('e-'+id).value),
        win: Number(document.getElementById('w-'+id).value),
        status: document.getElementById('s-'+id).value,
        roomId: document.getElementById('r-'+id).value,
        password: document.getElementById('p-'+id).value
      });
      alert('Updated');
    };
  </script>  <style>
    body { background:#0b0b0b; color:#fff; font-family:Arial; margin:0 }
    .top { display:flex; justify-content:space-between; padding:15px; background:#000 }
    .menu { cursor:pointer }
    .logout { display:none; position:absolute; right:10px; top:60px; background:#111; padding:10px }
    .logout button { background:red; color:#fff }
    .wrap { padding:20px }
    .card { background:#111; padding:15px; border-radius:10px; margin-bottom:15px }
    input { width:100%; margin:5px 0; padding:8px; background:#000; color:#0f0; border:1px solid #333 }
    button { padding:8px; background:#00ff88; border:none; font-weight:bold }
  </style></head>
<body><div id="login" class="wrap">
  <h2>Admin Login</h2>
  <input id="email" placeholder="Email" />
  <input id="pass" type="password" placeholder="Password" />
  <button onclick="loginAdmin()">Login</button>
</div><div id="panel" style="display:none">
  <div class="top">
    <h3>Matches</h3>
    <div class="menu" onclick="document.getElementById('lg').style.display='block'">☰</div>
  </div>
  <div id="lg" class="logout">
    <button onclick="logout()">Logout</button>
  </div>
  <div id="matches" class="wrap"></div>
</div></body>
</html>

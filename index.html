<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SQL Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <!-- Firebase SDKs -->  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ✅ YOUR REAL FIREBASE CONFIG (ALREADY FILLED)
    const firebaseConfig = {
      apiKey: "AIzaSyBvObxADcAior6R_or9O6UmWsFT8do1GkI",
      authDomain: "sqladmin-ff04d.firebaseapp.com",
      projectId: "sqladmin-ff04d",
      storageBucket: "sqladmin-ff04d.firebasestorage.app",
      messagingSenderId: "539086978850",
      appId: "1:539086978850:web:261e6a0cf3c9a2aa29ef7b",
      measurementId: "G-KH4J0CZ9M5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ---------- AUTH ----------
    window.loginAdmin = async () => {
      const email = emailInput.value;
      const pass = passwordInput.value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (e) {
        alert("Login failed");
      }
    };

    window.logout = async () => {
      await signOut(auth);
    };

    onAuthStateChanged(auth, user => {
      if (user) {
        loginBox.style.display = 'none';
        panel.style.display = 'block';
        loadPayments();
        loadMatches();
      } else {
        loginBox.style.display = 'block';
        panel.style.display = 'none';
      }
    });

    // ---------- PAYMENTS ----------
    async function loadPayments() {
      payments.innerHTML = "";
      const snap = await getDocs(collection(db, "payments"));
      snap.forEach(d => {
        const p = d.data();
        payments.innerHTML += `
          <div class="card">
            <b>Amount:</b> ₹${p.amount}<br>
            <b>TXID:</b> ${p.txid}<br>
            <b>Match:</b> ${p.matchType}<br>
            <b>Status:</b> ${p.status}<br>
            <button onclick="approvePay('${d.id}')">Approve</button>
            <button onclick="rejectPay('${d.id}')">Reject</button>
          </div>`;
      });
    }

    window.approvePay = async (id) => {
      await updateDoc(doc(db, "payments", id), { status: "approved" });
      loadPayments();
    };

    window.rejectPay = async (id) => {
      await updateDoc(doc(db, "payments", id), { status: "rejected" });
      loadPayments();
    };

    // ---------- MATCHES ----------
    async function loadMatches() {
      matches.innerHTML = "";
      const snap = await getDocs(collection(db, "matches"));
      snap.forEach(d => {
        const m = d.data();
        matches.innerHTML += `
          <div class="card">
            <b>${m.type}</b><br>
            Entry: <input id="e-${d.id}" value="${m.entry}" /><br>
            Win: <input id="w-${d.id}" value="${m.win}" /><br>
            Status: <input id="s-${d.id}" value="${m.status}" /><br>
            <button onclick="saveMatch('${d.id}')">Save</button>
          </div>`;
      });
    }

    window.saveMatch = async (id) => {
      await updateDoc(doc(db, "matches", id), {
        entry: Number(document.getElementById('e-' + id).value),
        win: Number(document.getElementById('w-' + id).value),
        status: document.getElementById('s-' + id).value
      });
      alert("Saved");
    };

  </script>  <style>
    body { margin:0; font-family: Arial; background:#0b0b0b; color:#fff; }
    h2 { color:#00ff88 }
    input { width:100%; padding:8px; margin:5px 0; background:#000; color:#0f0; border:1px solid #333 }
    button { padding:8px 12px; margin:5px 3px; background:#00ff88; border:none; font-weight:bold; cursor:pointer }
    .wrap { padding:20px }
    .card { background:#111; padding:15px; margin:10px 0; border:1px solid #333; border-radius:10px }
  </style></head>
<body><div id="loginBox" class="wrap">
  <h2>Admin Login</h2>
  <input id="emailInput" placeholder="Admin Email" />
  <input id="passwordInput" type="password" placeholder="Password" />
  <button onclick="loginAdmin()">LOGIN</button>
</div><div id="panel" class="wrap" style="display:none">
  <button onclick="logout()">Logout</button>  <h2>Payments</h2>
  <div id="payments"></div>  <h2>Matches</h2>
  <div id="matches"></div>
</div></body>
</html>

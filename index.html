<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>SQL MASTER | ALL-IN-ONE ADMIN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        :root { --accent: #00ff88; --gold: #ffd700; --bg: #050505; --card: #111; --red: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        header { background: #000; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 1000; }
        header h2 { margin: 0; font-size: 1.1rem; color: var(--gold); letter-spacing: 1px; }

        .wrap { padding: 15px; width: 100%; max-width: 600px; margin: 0 auto; }
        .card { background: var(--card); padding: 18px; border-radius: 15px; border: 1px solid #222; margin-bottom: 15px; }
        
        /* Form Styling */
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .field { display: flex; flex-direction: column; margin-bottom: 10px; }
        label { font-size: 0.65rem; color: #888; text-transform: uppercase; margin-bottom: 4px; font-weight: bold; }
        input, select { background: #000; border: 1px solid #333; color: var(--accent); padding: 12px; border-radius: 8px; font-size: 0.9rem; outline: none; width: 100%; }
        
        button { padding: 14px; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .btn-create { background: var(--gold); color: #000; width: 100%; margin-top: 10px; }
        .btn-save { background: var(--accent); color: #000; width: 100%; margin-top: 10px; }

        /* Navigation Tab */
        .nav-tabs { display: flex; background: #000; padding: 5px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #222; }
        .nav-btn { flex: 1; background: transparent; color: #666; padding: 10px; border-radius: 8px; border: none; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
        .nav-btn.active { background: #1a1a1a; color: var(--gold); }

        /* Payment Tab Styling */
        .tab-sub { display: flex; gap: 10px; margin-bottom: 15px; }
        .sub-btn { flex: 1; padding: 8px; font-size: 0.7rem; border-radius: 5px; background: #111; color: #fff; border: 1px solid #333; }
        .sub-btn.active { border-color: var(--gold); color: var(--gold); }
    </style>
</head>
<body>

    <header>
        <h2><i class="fas fa-crown"></i> SQL ADMIN PANEL</h2>
        <button id="logout-btn" style="background:none; color:var(--red); font-size:0.8rem; border:1px solid var(--red); padding:4px 10px;">LOGOUT</button>
    </header>

    <div class="wrap">
        <div class="nav-tabs">
            <button class="nav-btn active" id="btn-add" onclick="showTab('add')">ADD MATCH</button>
            <button class="nav-btn" id="btn-manage" onclick="showTab('manage')">MANAGE</button>
            <button class="nav-btn" id="btn-pay" onclick="showTab('pay')">PAYMENTS</button>
        </div>

        <div id="sec-add" class="tab-content">
            <div class="card">
                <h3 style="color:var(--gold); margin-top:0;">CREATE NEW TOURNAMENT</h3>
                <div class="grid-form">
                    <div class="field"><label>Map</label><input id="new-map" placeholder="e.g. Bermuda"></div>
                    <div class="field"><label>Type</label><input id="new-type" placeholder="e.g. Solo"></div>
                    <div class="field"><label>Entry Fee</label><input type="number" id="new-fee" value="10"></div>
                    <div class="field"><label>Win Prize</label><input type="number" id="new-win" value="18"></div>
                    <div class="field"><label>Total Slots</label><input type="number" id="new-slots" value="48"></div>
                    <div class="field"><label>Joined Players</label><input type="number" id="new-joined" value="0"></div>
                </div>
                <div class="field"><label>Start Time</label><input type="datetime-local" id="new-time"></div>
                <button class="btn-create" onclick="createNewMatch()"><i class="fas fa-rocket"></i> LAUNCH MATCH</button>
            </div>
        </div>

        <div id="sec-manage" class="tab-content" style="display:none">
            <div id="manage-list"></div>
        </div>

        <div id="sec-pay" class="tab-content" style="display:none">
            <div class="tab-sub">
                <button class="sub-btn active" id="sub-new" onclick="filterPay('pending')">NEW</button>
                <button class="sub-btn" id="sub-history" onclick="filterPay('history')">HISTORY</button>
            </div>
            <div id="pay-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvObxADcAior6R_or9O6UmWsFT8do1GkI",
            authDomain: "sqladmin-ff04d.firebaseapp.com",
            projectId: "sqladmin-ff04d",
            storageBucket: "sqladmin-ff04d.firebasestorage.app",
            messagingSenderId: "539086978850",
            appId: "1:539086978850:web:261e6a0cf3c9a2aa29ef7b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- Logout Fix ---
        document.getElementById('logout-btn').onclick = () => {
            signOut(auth).then(() => {
                alert("Logged out!");
                location.reload();
            });
        };

        // Tab Switcher Logic
        window.showTab = (tab) => {
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('sec-' + tab).style.display = 'block';
            document.getElementById('btn-' + tab).classList.add('active');
        };

        // 1. ADD NEW MATCH
        window.createNewMatch = async () => {
            const timeVal = document.getElementById('new-time').value;
            const data = {
                map: document.getElementById('new-map').value || 'Bermuda',
                type: document.getElementById('new-type').value || 'Solo',
                entry: Number(document.getElementById('new-fee').value),
                win: Number(document.getElementById('new-win').value),
                total: Number(document.getElementById('new-slots').value),
                joined: Number(document.getElementById('new-joined').value),
                status: 'open',
                startTime: timeVal ? new Date(timeVal).getTime() : Date.now(),
                roomId: '',
                password: ''
            };
            
            try {
                await addDoc(collection(db, "matches"), data);
                alert("Match Created Successfully!");
                showTab('manage');
                // Clear fields
                document.getElementById('new-map').value = '';
            } catch(e) { alert("Error: " + e.message); }
        };

        // 2. MANAGE MATCHES (REALTIME)
        onSnapshot(collection(db, "matches"), snap => {
            const list = document.getElementById('manage-list');
            list.innerHTML = "";
            snap.forEach(d => {
                const m = d.data();
                const id = d.id;
                const timeStr = m.startTime ? new Date(m.startTime).toISOString().slice(0, 16) : "";

                list.innerHTML += `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <span style="font-size:0.7rem; color:var(--gold)">ID: ${id.substring(0,8)}</span>
                        <button onclick="deleteMatch('${id}')" style="background:none; color:var(--red); padding:0; font-size:0.7rem;">DELETE</button>
                    </div>
                    <div class="grid-form">
                        <div class="field"><label>Map</label><input id="m-${id}" value="${m.map}"></div>
                        <div class="field"><label>Type</label><input id="t-${id}" value="${m.type}"></div>
                        <div class="field"><label>Joined</label><input type="number" id="j-${id}" value="${m.joined}"></div>
                        <div class="field"><label>Total Slots</label><input type="number" id="totl-${id}" value="${m.total}"></div>
                        <div class="field"><label>Status</label>
                            <select id="s-${id}">
                                <option value="open" ${m.status=='open'?'selected':''}>Open</option>
                                <option value="full" ${m.status=='full'?'selected':''}>Full</option>
                                <option value="started" ${m.status=='started'?'selected':''}>Started</option>
                            </select>
                        </div>
                        <div class="field"><label>Time</label><input type="datetime-local" id="time-${id}" value="${timeStr}"></div>
                    </div>
                    <div class="grid-form">
                        <div class="field"><label>Room ID</label><input id="rid-${id}" value="${m.roomId}"></div>
                        <div class="field"><label>Room Pass</label><input id="rps-${id}" value="${m.password}"></div>
                    </div>
                    <button class="btn-save" onclick="updateMatch('${id}')">SAVE UPDATES</button>
                </div>`;
            });
        });

        window.updateMatch = async (id) => {
            const timeVal = document.getElementById(`time-${id}`).value;
            await updateDoc(doc(db, "matches", id), {
                map: document.getElementById(`m-${id}`).value,
                type: document.getElementById(`t-${id}`).value,
                joined: Number(document.getElementById(`j-${id}`).value),
                total: Number(document.getElementById(`totl-${id}`).value),
                status: document.getElementById(`s-${id}`).value,
                startTime: timeVal ? new Date(timeVal).getTime() : 0,
                roomId: document.getElementById(`rid-${id}`).value,
                password: document.getElementById(`rps-${id}`).value
            });
            alert("Updated!");
        };

        window.deleteMatch = async (id) => {
            if(confirm("DANGEROUS: Match delete kar rahe ho?")) {
                await deleteDoc(doc(db, "matches", id));
            }
        };

        // 3. PAYMENTS LOGIC
        window.filterPay = (f) => {
            document.getElementById('sub-new').classList.toggle('active', f === 'pending');
            document.getElementById('sub-history').classList.toggle('active', f === 'history');
            renderPayments(f);
        };

        function renderPayments(filter = 'pending') {
            onSnapshot(collection(db, "payments"), snap => {
                const list = document.getElementById('pay-list');
                list.innerHTML = "";
                snap.forEach(d => {
                    const p = d.data();
                    if(filter === 'pending' && p.status !== 'pending') return;
                    if(filter === 'history' && p.status === 'pending') return;

                    list.innerHTML += `
                    <div class="card" style="border-left: 3px solid ${p.status=='approved'?'var(--accent)':'var(--gold)'}">
                        <div style="font-size:0.7rem; color:#888;">UTR: <b style="color:var(--gold); font-size:0.9rem;">${p.utr}</b></div>
                        <div style="font-size:0.6rem; margin-top:5px;">MATCH: ${p.matchId}</div>
                        ${p.status === 'pending' ? `
                            <div style="display:flex; gap:10px; margin-top:10px;">
                                <button onclick="actPay('${d.id}','approved')" style="flex:1; background:var(--accent); color:000; padding:8px; border-radius:5px; font-weight:bold;">APPROVE</button>
                                <button onclick="actPay('${d.id}','rejected')" style="flex:1; background:var(--red); color:#fff; padding:8px; border-radius:5px; font-weight:bold;">REJECT</button>
                            </div>
                        ` : `<div style="text-align:right; font-size:0.6rem; color:#555;">Status: ${p.status.toUpperCase()}</div>`}
                    </div>`;
                });
            });
        }
        renderPayments('pending');

        window.actPay = async (id, s) => { await updateDoc(doc(db, "payments", id), { status: s }); };

    </script>
</body>
</html>

<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{
      margin:0;font-family:Arial,Helvetica,sans-serif;
      background:#0b0b0b;color:#eafff1;
    }
    header{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 16px;background:#000;border-bottom:1px solid #1f1f1f;
    }
    .menu-btn{
      font-size:26px;cursor:pointer;color:#00ff88;
    }
    .title{font-size:18px;font-weight:bold;color:#00ff88}/* Sidebar */
.sidebar{
  position:fixed;top:0;left:-260px;width:240px;height:100%;
  background:#050505;border-right:1px solid #1f1f1f;
  padding:20px;transition:.3s;z-index:1000;
}
.sidebar.active{left:0}
.sidebar h3{color:#00ff88;margin-bottom:20px}
.sidebar button{
  width:100%;margin-bottom:12px;padding:12px;border:none;
  background:#111;color:#eafff1;border-radius:10px;cursor:pointer;
}
.sidebar button:hover{background:#00ff88;color:#000}

/* Overlay */
.overlay{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.6);z-index:900;
}
.overlay.active{display:block}

/* Content */
.content{padding:16px}
.card{
  background:#0f0f0f;border:1px solid #1f1f1f;
  border-radius:16px;padding:16px;margin-bottom:16px;
}
.btn{
  padding:10px 16px;border:none;border-radius:10px;cursor:pointer;
  margin-right:8px;font-weight:bold;
}
.approve{background:#00ff88;color:#000}
.reject{background:#ff4d4d;color:#fff}
.status{margin-top:8px;font-size:14px}

  </style>
</head>
<body><header>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <div class="title">Admin Panel</div>
</header><div class="sidebar" id="sidebar">
  <h3>Menu</h3>
  <button onclick="showPayments()">Payments</button>
  <button onclick="showMatches()">Matches</button>
  <button onclick="logout()">Logout</button>
</div>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div><div class="content" id="content"></div><script>
function toggleMenu(){
  sidebar.classList.toggle('active');
  overlay.classList.toggle('active');
}

function logout(){
  localStorage.removeItem('adminLogin');
  location.reload();
}

/* ===== PAYMENTS ===== */
function showPayments(){
  toggleMenu();
  const payments = JSON.parse(localStorage.getItem('payments')||'[]');
  let html = '<h2>Payments</h2>';
  payments.forEach((p,i)=>{
    html += `
      <div class="card">
        <b>Match:</b> ${p.matchId}<br>
        <b>Amount:</b> ₹${p.amount}<br>
        <b>UTR:</b> ${p.utr}<br>
        <b>Status:</b> ${p.status}
        <div style="margin-top:10px">
          <button class="btn approve" onclick="approve(${i})">Approve</button>
          <button class="btn reject" onclick="reject(${i})">Reject</button>
        </div>
      </div>`;
  });
  content.innerHTML = html;
}

function approve(i){
  const payments = JSON.parse(localStorage.getItem('payments'));
  payments[i].status = 'approved';
  localStorage.setItem('payments',JSON.stringify(payments));
  showPayments();
}

function reject(i){
  const payments = JSON.parse(localStorage.getItem('payments'));
  payments[i].status = 'rejected';
  localStorage.setItem('payments',JSON.stringify(payments));
  showPayments();
}

/* ===== MATCHES ===== */
function showMatches(){
  toggleMenu();
  const matches = JSON.parse(localStorage.getItem('matches')||'[]');
  let html = '<h2>Matches</h2>';
  matches.forEach(m=>{
    html += `<div class="card">
      <b>${m.id}</b><br>
      Room ID: ${m.roomId||'-'}<br>
      Password: ${m.roomPass||'-'}
    </div>`;
  });
  content.innerHTML = html;
}

// default load
showPayments();
</script></body>
</html>

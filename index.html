<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>SUPER ADMIN | GOD MODE v4.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root { 
            --accent: #00ff88; 
            --gold: #ffd700; 
            --bg: #0a0a0c; 
            --card: #16161a; 
            --red: #ff4d4d; 
            --muted: #8b8b9e; 
            --border: #2d2d3a; 
            --blue: #00d2ff; 
            --purple: #bc13fe;
            --glass: rgba(255, 255, 255, 0.03);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            background: var(--bg); 
            background-image: radial-gradient(circle at top right, #1a1a2e, transparent), radial-gradient(circle at bottom left, #16213e, transparent);
            color: #e2e2e2; 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            margin: 0; 
            padding-bottom: 80px; 
            min-height: 100vh;
        }

        /* HEADER POLISH */
        header { 
            background: rgba(0,0,0,0.8); 
            backdrop-filter: blur(15px);
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border); 
            position: sticky; 
            top: 0; 
            z-index: 1000;
        }
        header h2 { margin: 0; font-size: 1.1rem; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }
        
        .menu-btn { font-size: 1.4rem; color: var(--gold); cursor: pointer; }

        .wrap { padding: 15px; max-width: 900px; margin: 0 auto; }

        /* NAV TABS POLISH */
        .nav-tabs { display:flex; gap:8px; overflow-x:auto; padding: 10px 0; scrollbar-width: none; }
        .nav-btn { 
            flex: 0 0 auto; 
            background: var(--card); 
            color: var(--muted); 
            border: 1px solid var(--border); 
            padding: 10px 18px; 
            border-radius: 12px; 
            font-size: 0.75rem; 
            font-weight: 700; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-btn.active { 
            background: linear-gradient(135deg, var(--gold), #ffa500); 
            color: #000; 
            border-color: transparent; 
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        /* CARD POLISH */
        .card { 
            background: var(--card); 
            padding: 20px; 
            border-radius: 20px; 
            border: 1px solid var(--border); 
            margin-bottom: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        /* FORM INPUTS */
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .field { display:flex; flex-direction:column; margin-bottom:15px; }
        label { font-size: 0.65rem; color:var(--muted); text-transform:uppercase; margin-bottom:6px; font-weight:800; letter-spacing: 1px; }
        
        input, select, textarea { 
            background: #000; 
            border: 1px solid var(--border); 
            color: #fff; 
            padding: 12px 15px; 
            border-radius: 12px; 
            font-size: 0.9rem; 
            transition: 0.3s;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(0, 255, 136, 0.1); }

        /* BUTTONS */
        button { 
            padding: 14px; 
            border-radius: 14px; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            transition: 0.3s; 
            border: none;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-save { background: var(--accent); color: #000; width: 100%; }
        .btn-blue { background: linear-gradient(135deg, var(--blue), #0084ff); color: #fff; width: 100%; }
        .btn-danger { background: var(--red); color: #fff; width: 50px; }

        /* STATS */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-card { 
            background: var(--glass); 
            padding: 20px; 
            border-radius: 18px; 
            border: 1px solid var(--border); 
            text-align: center;
        }
        .stat-num { font-size: 1.6rem; font-weight: 900; color: var(--gold); }

        /* LISTS */
        .user-row { 
            display: flex; align-items: center; gap: 15px; 
            padding: 15px; background: var(--glass); 
            border-radius: 15px; margin-bottom: 10px; border: 1px solid transparent;
        }
        .user-row:active { border-color: var(--gold); background: rgba(255, 215, 0, 0.05); }
        .u-img { width: 45px; height: 45px; border-radius: 12px; border: 2px solid var(--border); }

        /* MODAL */
        .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:5000; display:none; align-items:center; justify-content:center; padding:20px; backdrop-filter: blur(10px); }
        .modal-box { background: var(--card); width:100%; max-width:500px; padding:25px; border-radius:24px; border: 1px solid var(--border); overflow-y: auto; max-height: 90vh; }

        .result-img-preview { 
            width: 100%; height: 180px; background: #000; 
            border: 2px dashed var(--border); border-radius: 15px; 
            display: flex; align-items: center; justify-content: center; 
            margin-bottom: 15px; overflow: hidden;
        }
        .result-img-preview img { width: 100%; height: 100%; object-fit: contain; }

    </style>
</head>
<body>

    <header>
        <div>
            <h2>God Mode <span style="color:var(--accent);">v4.0</span></h2>
        </div>
        <div class="menu-btn" onclick="location.reload()"><i class="fa-solid fa-sync-alt"></i></div>
    </header>

    <div class="wrap">
        <div class="nav-tabs">
            <button class="nav-btn active" id="tab-dash" onclick="showTab('dash')">OVERVIEW</button>
            <button class="nav-btn" id="tab-add" onclick="showTab('add')">NEW MATCH</button>
            <button class="nav-btn" id="tab-manage" onclick="showTab('manage')">MANAGE</button>
            <button class="nav-btn" id="tab-results" onclick="showTab('results')">UPLOAD RESULT</button>
            <button class="nav-btn" id="tab-pay" onclick="showTab('pay')">FINANCE</button>
            <button class="nav-btn" id="tab-users" onclick="showTab('users')">USERS</button>
        </div>

        <div id="view-dash" class="tab-content">
            <div class="stat-grid">
                <div class="stat-card"><div class="stat-num" id="st-users">0</div><label>Users</label></div>
                <div class="stat-card"><div class="stat-num" id="st-bal">₹0</div><label>Total Bal</label></div>
                <div class="stat-card"><div class="stat-num" id="st-matches">0</div><label>Matches</label></div>
                <div class="stat-card"><div class="stat-num" id="st-pending">0</div><label>Pending</label></div>
            </div>
        </div>

        <div id="view-add" class="tab-content" style="display:none;">
            <div class="card">
                <div class="grid-form">
                    <div class="field"><label>Map Name</label><input id="nm-map" value="Bermuda"></div>
                    <div class="field"><label>Type</label><input id="nm-type" value="Solo"></div>
                    <div class="field"><label>Fee</label><input type="number" id="nm-fee" value="10"></div>
                    <div class="field"><label>Per Kill</label><input type="number" id="nm-win" value="5"></div>
                </div>
                <div class="field"><label>Start Time</label><input type="datetime-local" id="nm-time"></div>
                <button class="btn-save" onclick="createMatch()">Create Match</button>
            </div>
        </div>

        <div id="view-manage" class="tab-content" style="display:none;">
            <div id="match-list"></div>
        </div>

        <div id="view-results" class="tab-content" style="display:none;">
            <div class="card" style="border-top: 4px solid var(--purple);">
                <h3 style="margin-top:0; font-size:1rem;">🏆 MATCH RESULT PUBLISHER</h3>
                
                <div class="field">
                    <label>Select Finished Match</label>
                    <select id="res-match-select" onchange="checkExistingResult()"></select>
                </div>

                <div class="result-img-preview" onclick="document.getElementById('res-img-file').click()">
                    <div id="res-img-placeholder" style="text-align:center; color:var(--muted);">
                        <i class="fa-solid fa-camera" style="font-size:2rem; margin-bottom:10px;"></i><br>
                        Click to Attach Screenshot
                    </div>
                    <img id="res-img-output" style="display:none;">
                </div>
                <input type="file" id="res-img-file" accept="image/*" style="display:none;" onchange="previewResImage(this)">

                <div class="grid-form">
                    <div class="field"><label>Winner Name</label><input id="res-win-name" placeholder="Name"></div>
                    <div class="field"><label>Winner Phone</label><input id="res-win-phone" placeholder="Phone"></div>
                    <div class="field"><label>Winner UID</label><input id="res-win-uid" placeholder="Game UID"></div>
                    <div class="field"><label>Opponent UID</label><input id="res-opp-uid" placeholder="Opponent UID"></div>
                </div>

                <div class="field">
                    <label>Winner Message / Note</label>
                    <textarea id="res-msg" placeholder="Congrats on the win! Killer gameplay..."></textarea>
                </div>

                <button class="btn-blue" id="btn-upload-res" onclick="uploadResult()">
                    <i class="fa-solid fa-cloud-upload-alt"></i> Publish Result
                </button>
            </div>
        </div>

        <div id="view-pay" class="tab-content" style="display:none;">
            <div id="pay-list-container"></div>
        </div>

        <div id="view-users" class="tab-content" style="display:none;">
            <input type="text" id="user-search" placeholder="Search users..." oninput="loadUsers(this.value)" style="margin-bottom:15px;">
            <div id="users-list"></div>
        </div>
    </div>

    <div id="user-modal" class="modal">
        <div class="modal-box" id="user-details-content"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, query, orderBy, getDoc, increment, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvObxADcAior6R_or9O6UmWsFT8do1GkI",
            authDomain: "sqladmin-ff04d.firebaseapp.com",
            projectId: "sqladmin-ff04d",
            storageBucket: "sqladmin-ff04d.firebasestorage.app",
            messagingSenderId: "539086978850",
            appId: "1:539086978850:web:261e6a0cf3c9a2aa29ef7b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // --- UI NAVIGATION ---
        window.showTab = (tab) => {
            document.querySelectorAll('.tab-content').forEach(v => v.style.display = 'none');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view-'+tab).style.display = 'block';
            document.getElementById('tab-'+tab).classList.add('active');
            
            if(tab === 'dash') loadDashboard();
            if(tab === 'manage') loadMatches();
            if(tab === 'results') loadFinishedMatches();
            if(tab === 'pay') loadPayments();
            if(tab === 'users') loadUsers();
        };

        // --- DASHBOARD ---
        function loadDashboard() {
            onSnapshot(collection(db, "users"), snap => {
                document.getElementById('st-users').innerText = snap.size;
                let bal = 0; snap.forEach(d => bal += (d.data().balance || 0));
                document.getElementById('st-bal').innerText = "₹" + bal;
            });
            onSnapshot(collection(db, "matches"), snap => {
                document.getElementById('st-matches').innerText = snap.size;
            });
        }

        // --- MATCHES ---
        window.createMatch = async () => {
            const data = {
                map: document.getElementById('nm-map').value,
                type: document.getElementById('nm-type').value,
                entry: Number(document.getElementById('nm-fee').value),
                win: Number(document.getElementById('nm-win').value),
                startTime: new Date(document.getElementById('nm-time').value).getTime(),
                status: 'open',
                createdAt: Date.now()
            };
            await addDoc(collection(db, "matches"), data);
            alert("Match Live!");
            showTab('manage');
        };

        function loadMatches() {
            onSnapshot(query(collection(db, "matches"), orderBy("startTime", "desc")), snap => {
                const list = document.getElementById('match-list');
                list.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    list.innerHTML += `
                        <div class="card">
                            <div style="display:flex; justify-content:space-between;">
                                <strong>${m.map}</strong>
                                <span style="color:var(--gold)">${m.status.toUpperCase()}</span>
                            </div>
                            <div style="font-size:0.7rem; color:var(--muted); margin:5px 0;">ID: ${d.id}</div>
                            <div class="grid-form">
                                <input id="m-rid-${d.id}" value="${m.roomId||''}" placeholder="Room ID">
                                <input id="m-pas-${d.id}" value="${m.password||''}" placeholder="Pass">
                            </div>
                            <select id="m-st-${d.id}" style="margin:10px 0; width:100%;">
                                <option value="open" ${m.status=='open'?'selected':''}>Open</option>
                                <option value="started" ${m.status=='started'?'selected':''}>Started</option>
                                <option value="finished" ${m.status=='finished'?'selected':''}>Finished</option>
                            </select>
                            <button class="btn-save" onclick="updateMatch('${d.id}')">Update</button>
                        </div>`;
                });
            });
        }

        window.updateMatch = async (id) => {
            await updateDoc(doc(db,"matches",id), {
                roomId: document.getElementById('m-rid-'+id).value,
                password: document.getElementById('m-pas-'+id).value,
                status: document.getElementById('m-st-'+id).value
            });
            alert("Updated!");
        };

        // --- RESULT UPLOAD LOGIC ---
        window.previewResImage = (input) => {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('res-img-output').src = e.target.result;
                    document.getElementById('res-img-output').style.display = 'block';
                    document.getElementById('res-img-placeholder').style.display = 'none';
                };
                reader.readAsDataURL(input.files[0]);
            }
        };

        window.loadFinishedMatches = () => {
            const select = document.getElementById('res-match-select');
            onSnapshot(query(collection(db, "matches"), where("status", "==", "finished")), snap => {
                select.innerHTML = '<option value="">-- Select Match --</option>';
                snap.forEach(d => {
                    const m = d.data();
                    select.innerHTML += `<option value="${d.id}">${m.map} (${d.id.substring(0,5)})</option>`;
                });
            });
        };

        window.uploadResult = async () => {
            const mid = document.getElementById('res-match-select').value;
            const btn = document.getElementById('btn-upload-res');
            if(!mid) return alert("Select Match!");

            btn.innerText = "Publishing...";
            
            const resultData = {
                winnerName: document.getElementById('res-win-name').value,
                winnerPhone: document.getElementById('res-win-phone').value,
                winnerUid: document.getElementById('res-win-uid').value,
                opponentUid: document.getElementById('res-opp-uid').value,
                message: document.getElementById('res-msg').value,
                screenshot: document.getElementById('res-img-output').src || '', // Base64 or URL
                publishedAt: Date.now()
            };

            try {
                await updateDoc(doc(db, "matches", mid), { result: resultData });
                alert("Result Published Successfully! 💯");
                btn.innerHTML = '<i class="fa-solid fa-cloud-upload-alt"></i> Publish Result';
            } catch(e) { alert(e.message); }
        };

        // --- USERS ---
        window.loadUsers = (search="") => {
            onSnapshot(collection(db, "users"), snap => {
                const list = document.getElementById('users-list');
                list.innerHTML = "";
                snap.forEach(d => {
                    const u = d.data();
                    if(search && !u.name.toLowerCase().includes(search.toLowerCase())) return;
                    list.innerHTML += `
                        <div class="user-row" onclick="viewUser('${d.id}')">
                            <img src="${u.dpUrl || 'https://via.placeholder.com/50'}" class="u-img">
                            <div style="flex:1"><strong>${u.name}</strong><br><small>${u.phone||''}</small></div>
                            <div style="color:var(--accent)">₹${u.balance}</div>
                        </div>`;
                });
            });
        };

        // Start
        showTab('dash');

    </script>
</body>
                                           </html>

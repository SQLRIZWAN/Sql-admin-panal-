<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>SQL MASTER | ADMIN PRO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        :root { --accent: #00ff88; --gold: #ffd700; --bg: #050505; --card: #111; --red: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        header { background: #000; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 1000; }
        header h2 { margin: 0; font-size: 1.1rem; color: var(--gold); letter-spacing: 1px; }
        .menu-icon { font-size: 1.4rem; color: var(--gold); cursor: pointer; }

        .wrap { padding: 15px; width: 100%; max-width: 600px; margin: 0 auto; }
        .card { background: var(--card); padding: 18px; border-radius: 15px; border: 1px solid #222; margin-bottom: 15px; border-left: 3px solid transparent; }
        
        /* Drawer Menu */
        #drawer { position: fixed; top: 0; right: -100%; width: 260px; height: 100%; background: #0d0d0d; border-left: 2px solid var(--gold); transition: 0.3s; z-index: 7000; padding: 60px 20px; }
        #drawer.active { right: 0; }
        .close-btn { position: absolute; top: 20px; left: 20px; font-size: 2rem; color: #fff; cursor: pointer; }
        .nav-link { display: block; width: 100%; padding: 15px; color: #fff; text-decoration: none; background: #1a1a1a; margin-bottom: 12px; border-radius: 10px; border: none; text-align: left; font-weight: bold; }
        .nav-link i { margin-right: 10px; color: var(--gold); }

        /* Form & Grid */
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .field { display: flex; flex-direction: column; margin-bottom: 10px; }
        label { font-size: 0.65rem; color: #888; text-transform: uppercase; margin-bottom: 4px; font-weight: bold; }
        input, select { background: #000; border: 1px solid #333; color: var(--accent); padding: 12px; border-radius: 8px; font-size: 0.9rem; outline: none; }
        
        button { padding: 14px; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-gold { background: var(--gold); color: #000; width: 100%; margin-top: 10px; }
        .btn-green { background: var(--accent); color: #000; width: 100%; margin-top: 10px; }
        
        /* Status Badges */
        .badge-info { font-size: 0.7rem; color: #aaa; background: #222; padding: 4px 10px; border-radius: 5px; }

        /* Payments History */
        .sub-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .sub-btn { flex: 1; padding: 10px; font-size: 0.75rem; border-radius: 8px; background: #111; color: #888; border: 1px solid #333; }
        .sub-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }
    </style>
</head>
<body>

    <header>
        <h2><i class="fas fa-hammer"></i> SQL ADMIN</h2>
        <div class="menu-icon" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    </header>

    <div id="drawer">
        <div class="close-btn" onclick="toggleMenu()">&times;</div>
        <button class="nav-link" onclick="showTab('add')"><i class="fas fa-plus"></i> ADD MATCH</button>
        <button class="nav-link" onclick="showTab('manage')"><i class="fas fa-edit"></i> MANAGE MATCHES</button>
        <button class="nav-link" onclick="showTab('pay')"><i class="fas fa-receipt"></i> PAYMENTS</button>
        <button class="nav-link" onclick="logoutAdmin()" style="background:var(--red); color:#fff; margin-top:100px;">
            <i class="fas fa-sign-out-alt"></i> LOGOUT
        </button>
    </div>

    <div id="login-box" class="wrap" style="display:none; text-align:center; margin-top:100px;">
        <div class="card">
            <h3 style="color:var(--gold)">ADMIN AUTHENTICATION</h3>
            <input type="email" id="email" placeholder="Email" style="width:100%; margin-bottom:10px;">
            <input type="password" id="pass" placeholder="Password" style="width:100%; margin-bottom:15px;">
            <button class="btn-green" onclick="login()">LOGIN</button>
        </div>
    </div>

    <div id="main-panel" class="wrap" style="display:none">
        <div id="sec-add" class="tab-content">
            <div class="card">
                <h3 style="color:var(--gold)">CREATE TOURNAMENT</h3>
                <div class="grid-form">
                    <div class="field"><label>Map Name</label><input id="n-map" placeholder="Bermuda"></div>
                    <div class="field"><label>Match Type</label><input id="n-type" placeholder="1v1 / Solo"></div>
                    <div class="field"><label>Entry Fee</label><input type="number" id="n-fee" value="10"></div>
                    <div class="field"><label>Win Prize</label><input type="number" id="n-prize" value="18"></div>
                    <div class="field"><label>Total Slots</label><input type="number" id="n-slots" value="48"></div>
                    <div class="field"><label>Start Time</label><input type="datetime-local" id="n-time"></div>
                </div>
                <button class="btn-gold" onclick="addMatch()">LAUNCH TOURNAMENT</button>
            </div>
        </div>

        <div id="sec-manage" class="tab-content" style="display:none">
            <h3 style="color:var(--gold)">LIVE MATCHES</h3>
            <div id="manage-container"></div>
        </div>

        <div id="sec-pay" class="tab-content" style="display:none">
            <div class="sub-tabs">
                <button id="tab-new" class="sub-btn active" onclick="switchPay('pending')">NEW REQUESTS</button>
                <button id="tab-hist" class="sub-btn" onclick="switchPay('history')">HISTORY</button>
            </div>
            <div id="pay-container"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvObxADcAior6R_or9O6UmWsFT8do1GkI",
            authDomain: "sqladmin-ff04d.firebaseapp.com",
            projectId: "sqladmin-ff04d",
            storageBucket: "sqladmin-ff04d.firebasestorage.app",
            messagingSenderId: "539086978850",
            appId: "1:539086978850:web:261e6a0cf3c9a2aa29ef7b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // UI Handlers
        window.toggleMenu = () => document.getElementById('drawer').classList.toggle('active');
        window.showTab = (tab) => {
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.getElementById('sec-' + tab).style.display = 'block';
            toggleMenu();
        };

        // Auth Logic
        onAuthStateChanged(auth, user => {
            document.getElementById('login-box').style.display = user ? 'none' : 'block';
            document.getElementById('main-panel').style.display = user ? 'block' : 'none';
            if(user) loadAllData();
        });

        window.login = () => {
            signInWithEmailAndPassword(auth, email.value, pass.value).catch(() => alert("Access Denied"));
        };

        window.logoutAdmin = () => signOut(auth).then(() => location.reload());

        // Match Logic
        window.addMatch = async () => {
            const time = document.getElementById('n-time').value;
            const data = {
                map: document.getElementById('n-map').value,
                type: document.getElementById('n-type').value,
                entry: Number(document.getElementById('n-fee').value),
                win: Number(document.getElementById('n-prize').value),
                total: Number(document.getElementById('n-slots').value),
                joined: 0,
                status: 'open',
                startTime: time ? new Date(time).getTime() : Date.now(),
                roomId: '', password: ''
            };
            await addDoc(collection(db, "matches"), data);
            alert("Match Added!");
            showTab('manage');
        };

        function loadAllData() {
            // Realtime Matches
            onSnapshot(collection(db, "matches"), snap => {
                const cont = document.getElementById('manage-container');
                cont.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    const id = d.id;
                    const t = m.startTime ? new Date(m.startTime).toISOString().slice(0, 16) : "";
                    
                    cont.innerHTML += `
                    <div class="card" style="border-left-color: var(--accent)">
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                            <span class="badge-info">ID: ${id.substring(0,6)}</span>
                            <button onclick="delM('${id}')" style="color:var(--red); background:none; font-size:0.7rem;">DELETE</button>
                        </div>
                        <div class="grid-form">
                            <div class="field"><label>Map</label><input id="map-${id}" value="${m.map}"></div>
                            <div class="field"><label>Type</label><input id="type-${id}" value="${m.type}"></div>
                            <div class="field"><label>Joined Players</label><input type="number" id="join-${id}" value="${m.joined}"></div>
                            <div class="field"><label>Total Slots</label><input type="number" id="totl-${id}" value="${m.total}"></div>
                            <div class="field"><label>Status</label>
                                <select id="stat-${id}">
                                    <option value="open" ${m.status=='open'?'selected':''}>Open</option>
                                    <option value="full" ${m.status=='full'?'selected':''}>Full</option>
                                    <option value="started" ${m.status=='started'?'selected':''}>Started</option>
                                </select>
                            </div>
                            <div class="field"><label>Start Time</label><input type="datetime-local" id="time-${id}" value="${t}"></div>
                        </div>
                        <div class="grid-form" style="margin-top:10px;">
                            <div class="field"><label>Room ID</label><input id="rid-${id}" value="${m.roomId}"></div>
                            <div class="field"><label>Room Pass</label><input id="rps-${id}" value="${m.password}"></div>
                        </div>
                        <button class="btn-green" onclick="updM('${id}')">SAVE UPDATES</button>
                    </div>`;
                });
            });

            loadPayments();
        }

        window.updM = async (id) => {
            const timeVal = document.getElementById(`time-${id}`).value;
            await updateDoc(doc(db, "matches", id), {
                map: document.getElementById(`map-${id}`).value,
                type: document.getElementById(`type-${id}`).value,
                joined: Number(document.getElementById(`join-${id}`).value),
                total: Number(document.getElementById(`totl-${id}`).value),
                status: document.getElementById(`stat-${id}`).value,
                startTime: timeVal ? new Date(timeVal).getTime() : 0,
                roomId: document.getElementById(`rid-${id}`).value,
                password: document.getElementById(`rps-${id}`).value
            });
            alert("Match Updated!");
        };

        window.delM = async (id) => { if(confirm("Delete this match?")) await deleteDoc(doc(db, "matches", id)); };

        // Payment Tab Logic
        let currentP = 'pending';
        window.switchPay = (f) => {
            currentP = f;
            document.getElementById('tab-new').classList.toggle('active', f === 'pending');
            document.getElementById('tab-hist').classList.toggle('active', f === 'history');
            loadPayments();
        };

        function loadPayments() {
            onSnapshot(collection(db, "payments"), snap => {
                const cont = document.getElementById('pay-container');
                cont.innerHTML = "";
                snap.forEach(d => {
                    const p = d.data();
                    if(currentP === 'pending' && p.status !== 'pending') return;
                    if(currentP === 'history' && p.status === 'pending') return;

                    cont.innerHTML += `
                    <div class="card" style="border-left-color: ${p.status=='approved'?'var(--accent)':'var(--gold)'}">
                        <div style="font-size:0.8rem;">UTR: <b style="color:var(--gold)">${p.utr}</b></div>
                        <div style="font-size:0.6rem; color:#666; margin-top:5px;">Match: ${p.matchId}</div>
                        ${p.status === 'pending' ? `
                            <div style="display:flex; gap:10px; margin-top:15px;">
                                <button onclick="payAct('${d.id}','approved')" style="flex:1; background:var(--accent); padding:8px; border-radius:5px; font-size:0.7rem; font-weight:bold;">APPROVE</button>
                                <button onclick="payAct('${d.id}','rejected')" style="flex:1; background:var(--red); color:#fff; padding:8px; border-radius:5px; font-size:0.7rem; font-weight:bold;">REJECT</button>
                            </div>
                        ` : `<div style="text-align:right; font-size:0.6rem; color:#888; margin-top:10px;">${p.status.toUpperCase()}</div>`}
                    </div>`;
                });
            });
        }
        window.payAct = async (id, s) => { await updateDoc(doc(db, "payments", id), { status: s }); };

    </script>
</body>
</html>

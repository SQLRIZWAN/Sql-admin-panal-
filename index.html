<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>SQL MASTER | SUPER ADMIN PRO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root { --accent: #00ff88; --gold: #ffd700; --bg: #050505; --card: #111; --red: #ff4444; --border: #262626; --blue: #00d9ff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 20px; }
        
        /* HEADER */
        header { background: #000; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 1000; }
        header h2 { margin: 0; font-size: 1rem; color: var(--gold); font-weight: 800; }

        /* TAB NAVIGATION */
        .nav-tabs { display: flex; overflow-x: auto; background: #000; padding: 10px; gap: 8px; border-bottom: 1px solid var(--border); }
        .nav-btn { flex: 0 0 auto; background: #151515; color: #888; border: 1px solid var(--border); padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; position: relative; cursor: pointer; }
        .nav-btn.active { background: #222; color: var(--gold); border-color: var(--gold); }

        /* NOTIFICATION BADGE */
        .badge { position: absolute; top: -5px; right: -5px; background: var(--red); color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 10px; font-weight: bold; border: 1px solid #000; display: none; }

        .wrap { padding: 15px; max-width: 800px; margin: 0 auto; }

        /* CARDS & FORMS */
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 15px; position: relative; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .field { margin-bottom: 10px; }
        label { display: block; font-size: 0.65rem; color: #777; text-transform: uppercase; margin-bottom: 4px; font-weight: 700; }
        input, select { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; font-size: 0.9rem; }
        input:focus { border-color: var(--accent); }

        /* BUTTONS */
        button { border: none; cursor: pointer; font-weight: 700; transition: 0.2s; border-radius: 6px; }
        .btn-main { background: var(--gold); color: #000; width: 100%; padding: 12px; margin-top: 5px; }
        .btn-save { background: var(--accent); color: #000; width: 100%; padding: 10px; }
        .btn-del { background: rgba(255,68,68,0.1); border: 1px solid var(--red); color: var(--red); font-size: 0.6rem; padding: 4px 8px; position: absolute; top: 10px; right: 10px; }
        
        /* PAYMENT SUB TABS */
        .sub-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .sub-btn { background: #111; color: #fff; border: 1px solid #333; padding: 10px; border-radius: 8px; font-size: 0.7rem; position: relative; }
        .sub-btn.active { border-color: var(--accent); color: var(--accent); background: #001a0d; }

        /* LISTS */
        .user-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid #222; }
        .u-img { width: 45px; height: 45px; border-radius: 50%; border: 1px solid var(--gold); }
        .ss-img { width: 100%; border-radius: 8px; margin: 10px 0; border: 1px solid #333; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h2>SQL MASTER ADMIN PANEL</h2>
        <button onclick="location.reload()" style="background:var(--gold); color:#000; padding:5px 12px; font-size:0.7rem;">REFRESH</button>
    </header>

    <div class="nav-tabs">
        <div class="nav-btn active" id="tab-add" onclick="switchTab('add')">ADD MATCH</div>
        <div class="nav-btn" id="tab-manage" onclick="switchTab('manage')">MANAGE MATCH</div>
        <div class="nav-btn" id="tab-pay" onclick="switchTab('pay')">
            PAYMENTS <span id="b-main-pay" class="badge">0</span>
        </div>
        <div class="nav-btn" id="tab-users" onclick="switchTab('users')">ALL USERS</div>
    </div>

    <div class="wrap">
        <div id="v-add" class="view">
            <div class="card">
                <h3 style="margin-top:0; color:var(--gold);">NEW TOURNAMENT</h3>
                <div class="grid">
                    <div class="field"><label>Map Name</label><input id="n-map" value="Bermuda"></div>
                    <div class="field"><label>Match Type</label><input id="n-type" value="Solo"></div>
                    <div class="field"><label>Entry Fee (₹)</label><input type="number" id="n-fee" value="10"></div>
                    <div class="field"><label>Win Prize (₹)</label><input type="number" id="n-win" value="100"></div>
                    <div class="field"><label>Total Slots</label><input type="number" id="n-slots" value="48"></div>
                    <div class="field"><label>Fake Joiners</label><input type="number" id="n-fake" value="0"></div>
                </div>
                <div class="field"><label>Start Date & Time</label><input type="datetime-local" id="n-time"></div>
                <button class="btn-main" onclick="addMatch()">PUBLISH NOW</button>
            </div>
        </div>

        <div id="v-manage" class="view" style="display:none;">
            <div id="match-list"></div>
        </div>

        <div id="v-pay" class="view" style="display:none;">
            <div class="sub-nav">
                <button class="sub-btn active" id="sb-fund" onclick="setPayTab('fund')">ADD FUND REQ <span id="b-fund" class="badge">0</span></button>
                <button class="sub-btn" id="sb-fund-h" onclick="setPayTab('fund-h')">FUND HISTORY</button>
                <button class="sub-btn" id="sb-draw" onclick="setPayTab('draw')">WITHDRAW REQ <span id="b-draw" class="badge">0</span></button>
                <button class="sub-btn" id="sb-draw-h" onclick="setPayTab('draw-h')">WITHDRAW HISTORY</button>
                <button class="sub-btn" style="grid-column: span 2; border-color:var(--blue);" onclick="setPayTab('join')">DIRECT JOIN PAYMENTS</button>
            </div>
            <div id="pay-list"></div>
        </div>

        <div id="v-users" class="view" style="display:none;">
            <div class="card" style="text-align:center;">
                <h1 id="count-users" style="margin:0; color:var(--accent);">0</h1>
                <label>Total Registered Players</label>
                <input type="text" placeholder="Search by name or phone..." oninput="loadUsers(this.value)" style="margin-top:10px;">
            </div>
            <div id="users-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, query, orderBy, getDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvObxADcAior6R_or9O6UmWsFT8do1GkI",
            authDomain: "sqladmin-ff04d.firebaseapp.com",
            projectId: "sqladmin-ff04d",
            storageBucket: "sqladmin-ff04d.firebasestorage.app",
            messagingSenderId: "539086978850",
            appId: "1:539086978850:web:261e6a0cf3c9a2aa29ef7b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- CORE UI ---
        window.switchTab = (t) => {
            document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('v-'+t).style.display = 'block';
            document.getElementById('tab-'+t).classList.add('active');
            if(t === 'manage') loadMatches();
            if(t === 'pay') loadPayments();
            if(t === 'users') loadUsers();
        };

        let currentPayTab = 'fund';
        window.setPayTab = (t) => {
            currentPayTab = t;
            document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('sb-'+t)?.classList.add('active');
            loadPayments();
        };

        // --- MATCHES ---
        window.addMatch = async () => {
            try {
                const dt = {
                    map: document.getElementById('n-map').value,
                    type: document.getElementById('n-type').value,
                    entry: Number(document.getElementById('n-fee').value),
                    win: Number(document.getElementById('n-win').value),
                    total: Number(document.getElementById('n-slots').value),
                    joined: Number(document.getElementById('n-fake').value),
                    startTime: new Date(document.getElementById('n-time').value).getTime(),
                    status: 'open', roomId: '', password: ''
                };
                await addDoc(collection(db, "matches"), dt);
                alert("Match Published!");
                switchTab('manage');
            } catch(e) { alert(e.message); }
        };

        function loadMatches() {
            onSnapshot(query(collection(db, "matches"), orderBy("startTime", "desc")), snap => {
                const list = document.getElementById('match-list');
                list.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    list.innerHTML += `
                    <div class="card">
                        <button class="btn-del" onclick="delDoc('matches','${d.id}')">DELETE</button>
                        <div class="grid" style="margin-top:15px;">
                            <div class="field"><label>Map</label><input id="m-map-${d.id}" value="${m.map}"></div>
                            <div class="field"><label>Type</label><input id="m-type-${d.id}" value="${m.type}"></div>
                            <div class="field"><label>Room ID</label><input id="m-rid-${d.id}" value="${m.roomId||''}" placeholder="--"></div>
                            <div class="field"><label>Password</label><input id="m-pas-${d.id}" value="${m.password||''}" placeholder="--"></div>
                            <div class="field"><label>Slots</label><input type="number" id="m-tot-${d.id}" value="${m.total}"></div>
                            <div class="field"><label>Joined</label><input type="number" id="m-joi-${d.id}" value="${m.joined}"></div>
                        </div>
                        <div class="field"><label>Status</label>
                            <select id="m-st-${d.id}">
                                <option value="open" ${m.status=='open'?'selected':''}>OPEN</option>
                                <option value="started" ${m.status=='started'?'selected':''}>STARTED</option>
                                <option value="finished" ${m.status=='finished'?'selected':''}>FINISHED</option>
                            </select>
                        </div>
                        <button class="btn-save" onclick="updMatch('${d.id}')">SAVE CHANGES</button>
                    </div>`;
                });
            });
        }
        window.updMatch = async (id) => {
            await updateDoc(doc(db, "matches", id), {
                map: document.getElementById(`m-map-${id}`).value,
                type: document.getElementById(`m-type-${id}`).value,
                roomId: document.getElementById(`m-rid-${id}`).value,
                password: document.getElementById(`m-pas-${id}`).value,
                total: Number(document.getElementById(`m-tot-${id}`).value),
                joined: Number(document.getElementById(`m-joi-${id}`).value),
                status: document.getElementById(`m-st-${id}`).value
            });
            alert("Updated!");
        };

        // --- PAYMENTS & HISTORY ---
        function loadPayments() {
            const list = document.getElementById('pay-list');
            list.innerHTML = "Loading...";

            onSnapshot(collection(db, "payments"), pSnap => {
                onSnapshot(collection(db, "withdrawals"), wSnap => {
                    // Update Badges
                    let f_pending = 0, d_pending = 0;
                    pSnap.forEach(x => { if(x.data().status==='pending' && x.data().type==='deposit') f_pending++; });
                    wSnap.forEach(x => { if(x.data().status==='pending') d_pending++; });

                    document.getElementById('b-fund').innerText = f_pending;
                    document.getElementById('b-fund').style.display = f_pending > 0 ? 'flex' : 'none';
                    document.getElementById('b-draw').innerText = d_pending;
                    document.getElementById('b-draw').style.display = d_pending > 0 ? 'flex' : 'none';
                    document.getElementById('b-main-pay').innerText = f_pending + d_pending;
                    document.getElementById('b-main-pay').style.display = (f_pending+d_pending) > 0 ? 'flex' : 'none';

                    list.innerHTML = "";
                    const activeSnap = currentPayTab.includes('draw') ? wSnap : pSnap;

                    activeSnap.forEach(d => {
                        const p = d.data();
                        const isP = p.status === 'pending';
                        let canShow = false;

                        if(currentPayTab==='fund' && isP && p.type==='deposit') canShow = true;
                        if(currentPayTab==='fund-h' && !isP && p.type==='deposit') canShow = true;
                        if(currentPayTab==='draw' && isP) canShow = true;
                        if(currentPayTab==='draw-h' && !isP) canShow = true;
                        if(currentPayTab==='join' && p.matchId && p.matchId !== 'ADD_FUND') canShow = true;

                        if(canShow) {
                            list.innerHTML += `
                            <div class="card" style="border-left:4px solid ${isP?'var(--gold)':'var(--accent)'}">
                                <button class="btn-del" onclick="delDoc('${currentPayTab.includes('draw')?'withdrawals':'payments'}','${d.id}')">DEL</button>
                                <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                                    <b>${p.userName}</b>
                                    <span style="font-size:0.7rem; color:${isP?'var(--gold)':'#00ff88'}">${p.status.toUpperCase()}</span>
                                </div>
                                <div style="font-size:1.1rem; font-weight:800; color:var(--gold)">₹${p.amount}</div>
                                <div style="font-size:0.75rem; color:#888;">${p.utr ? 'UTR: '+p.utr : 'UPI: '+p.upi}</div>
                                ${p.ss ? `<img src="${p.ss}" class="ss-img" onclick="window.open('${p.ss}')">` : ''}
                                ${isP ? `
                                    <div class="grid" style="margin-top:10px;">
                                        <button onclick="handleReq('${d.id}','${currentPayTab.includes('draw')?'withdrawals':'payments'}','${p.userId}','${p.amount}','app')" style="background:var(--accent); color:#000; padding:8px;">APPROVE</button>
                                        <button onclick="handleReq('${d.id}','${currentPayTab.includes('draw')?'withdrawals':'payments'}','${p.userId}','${p.amount}','rej')" style="background:var(--red); color:#fff; padding:8px;">REJECT</button>
                                    </div>
                                ` : ''}
                            </div>`;
                        }
                    });
                    if(list.innerHTML === "") list.innerHTML = "<center style='color:#555; padding:20px;'>No Records Found</center>";
                });
            });
        }

        window.handleReq = async (id, col, uid, amt, act) => {
            if(!confirm("Are you sure?")) return;
            const newStatus = act === 'app' ? 'approved' : 'rejected';
            await updateDoc(doc(db, col, id), { status: newStatus });
            if(act === 'app' && col === 'payments') {
                await updateDoc(doc(db, "users", uid), { balance: increment(Number(amt)) });
            }
            if(act === 'rej' && col === 'withdrawals') {
                await updateDoc(doc(db, "users", uid), { balance: increment(Number(amt)) });
            }
            alert("Action Success!");
        };

        // --- USERS ---
        window.loadUsers = (search = "") => {
            onSnapshot(collection(db, "users"), snap => {
                document.getElementById('count-users').innerText = snap.size;
                const list = document.getElementById('users-list');
                list.innerHTML = "";
                snap.forEach(d => {
                    const u = d.data();
                    if(search && !u.name.toLowerCase().includes(search.toLowerCase()) && !d.id.includes(search)) return;
                    list.innerHTML += `
                    <div class="user-row">
                        <img src="${u.dpUrl || 'https://img.icons8.com/color/96/user-male-circle.png'}" class="u-img">
                        <div style="flex:1;">
                            <div style="font-weight:bold; font-size:0.9rem;">${u.name}</div>
                            <div style="font-size:0.7rem; color:#666;">${d.id}</div>
                        </div>
                        <div style="text-align:right;">
                            <div style="color:var(--accent); font-weight:800;">₹${u.balance}</div>
                            <button onclick="editUser('${d.id}')" style="background:#222; color:#fff; font-size:0.6rem; padding:3px 6px;">EDIT</button>
                        </div>
                    </div>`;
                });
            });
        };

        window.editUser = async (uid) => {
            const snap = await getDoc(doc(db, "users", uid));
            const u = snap.data();
            const newBal = prompt("Enter New Balance for " + u.name, u.balance);
            if(newBal !== null) {
                await updateDoc(doc(db, "users", uid), { balance: Number(newBal) });
                alert("Balance Updated!");
            }
        };

        window.delDoc = async (col, id) => {
            if(confirm("Permanent Delete?")) await deleteDoc(doc(db, col, id));
        };

        // INIT
        switchTab('add');
    </script>
</body>
</html>

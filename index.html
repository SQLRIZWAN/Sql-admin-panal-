<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>SUPER ADMIN | GOD MODE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root { --accent: #00ff88; --gold: #ffd700; --bg: #050505; --card: #111; --red: #ff4444; --muted:#999; --border:#222; --blue: #0084ff; --purple: #9d00ff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 80px; width: 100%; overflow-x: hidden; }
        
        /* HEADER */
        header { background: #000; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 1000; box-shadow: 0 5px 20px rgba(0,0,0,0.8); width: 100%; }
        header h2 { margin: 0; font-size: 1.2rem; color: var(--gold); letter-spacing: 1px; font-weight: 800; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        
        .menu-btn { font-size: 1.5rem; color: #fff; cursor: pointer; padding: 5px; }
        .menu-dropdown { position: absolute; top: 60px; right: 10px; background: #1a1a1a; border: 1px solid var(--gold); border-radius: 10px; width: 160px; display: none; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px #000; }
        .menu-dropdown.show { display: flex; animation: slideDown 0.2s ease; }
        .menu-item { padding: 12px; border-bottom: 1px solid #333; text-align: center; font-weight: bold; cursor: pointer; color: #ccc; }
        .menu-item:hover { background: #333; color: var(--gold); }
        .menu-item:last-child { border: none; color: var(--red); }

        @keyframes slideDown { from {opacity:0; transform:translateY(-10px);} to {opacity:1; transform:translateY(0);} }

        /* UI FIX: Centering the layout */
        .wrap { padding: 15px; max-width: 900px; margin: 0 auto; display: block; clear: both; }
        
        /* NAV TABS */
        .nav-tabs { display:flex; gap:10px; overflow-x:auto; padding-bottom:10px; margin-bottom:10px; scrollbar-width: none; -ms-overflow-style: none; }
        .nav-tabs::-webkit-scrollbar { display: none; }
        .nav-btn { flex:1; min-width:100px; background:#111; color:#888; border:1px solid #222; padding:12px; border-radius:10px; text-align:center; font-weight:700; position: relative; font-size: 0.8rem; transition: 0.3s; white-space: nowrap; }
        .nav-btn.active { background: #222; color: var(--gold); border-color: var(--gold); box-shadow: 0 0 10px rgba(255, 215, 0, 0.1); transform: translateY(-2px); }
        .badge { position: absolute; top: -5px; right: -5px; background: var(--red); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; display: none; border: 1px solid #fff; }

        /* CARDS */
        .card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 20px; position:relative; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; }
        
        /* Form Inputs Polish */
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .field { display:flex; flex-direction:column; margin-bottom:12px; }
        label { font-size: 0.7rem; color:var(--muted); text-transform:uppercase; margin-bottom:5px; font-weight:700; letter-spacing: 0.5px; }
        input, select, textarea { background:#0a0a0a; border:1px solid #333; color:#fff; padding:12px; border-radius:8px; font-size:0.9rem; width: 100%; transition: 0.3s; font-family: 'Courier New', monospace; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); background: #0f1f15; }
        textarea { resize: vertical; min-height: 100px; }

        /* Buttons Polish */
        button { padding:14px; border:none; border-radius:8px; font-weight:800; cursor:pointer; font-size: 0.9rem; letter-spacing: 1px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button:active { transform: scale(0.98); }
        .btn-save { background:var(--accent); color:#000; width:100%; box-shadow: 0 4px 15px rgba(0, 255, 136, 0.2); }
        .btn-blue { background: var(--blue); color: #fff; width: 100%; }
        .danger { background:var(--red); color:#fff; }
        .btn-purple { background: var(--purple); color: #fff; width: 100%; margin-top: 10px; }
        .btn-copy { padding: 5px 10px; font-size: 0.7rem; background: #333; color: #fff; border-radius: 4px; margin-left: 10px; }

        /* Match Card ID Display */
        .match-id-display { font-family: monospace; color: #666; font-size: 0.8rem; margin-top: 5px; display: flex; align-items: center; }

        /* Pay Tabs */
        .pay-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; background: #111; padding: 10px; border-radius: 12px; border: 1px solid #222; }
        .p-btn { flex: 1 1 45%; padding: 12px 5px; background: #000; border: 1px solid #333; color: #888; border-radius: 8px; font-size: 0.7rem; font-weight: bold; text-align: center; }
        .p-btn.active { border-color: var(--accent); color: var(--accent); background: #002211; }
        .p-btn-wide { flex: 1 1 100%; border-color: var(--blue); color: var(--blue); }

        /* Loading & Stats */
        .loading-spinner { text-align: center; padding: 20px; color: var(--accent); font-weight: bold; animation: pulse 1s infinite; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: linear-gradient(135deg, #111 0%, #1a1a1a 100%); padding: 15px; border-radius: 10px; border: 1px solid #333; text-align: center; }
        .stat-num { font-size: 1.5rem; font-weight: 900; color: var(--gold); }
        .stat-label { font-size: 0.7rem; color: #888; text-transform: uppercase; }

        /* Users & Modal */
        .user-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid #222; transition: 0.2s; cursor: pointer; }
        .user-row:hover { background: #151515; }
        .u-img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; }
        .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:5000; display:none; align-items:center; justify-content:center; padding:20px; backdrop-filter: blur(5px); }
        .modal-box { background:#111; width:100%; max-width:500px; padding:25px; border-radius:15px; border: 1px solid var(--gold); overflow-y: auto; max-height: 90vh; }
        .pay-ss { width: 100%; max-height: 250px; object-fit: contain; border-radius: 8px; margin: 10px 0; background: #000; border: 1px solid #333; }
        
        /* Result History UI */
        .res-hist-card { background:#000; border:1px solid #222; padding:12px; border-radius:10px; margin-top:10px; }
        .res-hist-img { width:100%; max-height:150px; object-fit:cover; border-radius:5px; margin-top:5px; }

        @keyframes pulse { 0% {opacity: 0.5;} 50% {opacity: 1;} 100% {opacity: 0.5;} }
    </style>
</head>
<body>

    <header>
        <div>
            <h2>SUPER ADMIN</h2>
            <small style="color:#666; font-size:0.7rem;">GOD MODE v3.0</small>
        </div>
        
        <div style="position: relative;">
            <div class="menu-btn" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </div>
            <div id="admin-menu" class="menu-dropdown">
                <div class="menu-item" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i> Refresh</div>
                <div class="menu-item" onclick="toggleMaintenance()"><i class="fa-solid fa-lock"></i> Maint. Mode</div>
                <div class="menu-item" onclick="logoutAdmin()"><i class="fa-solid fa-power-off"></i> Logout</div>
            </div>
        </div>
    </header>

    <div class="wrap">
        <div class="nav-tabs">
            <button class="nav-btn active" id="tab-dash" onclick="showTab('dash')"><i class="fa-solid fa-chart-line"></i> STATS</button>
            <button class="nav-btn" id="tab-add" onclick="showTab('add')"><i class="fa-solid fa-plus"></i> ADD</button>
            <button class="nav-btn" id="tab-manage" onclick="showTab('manage')"><i class="fa-solid fa-list-check"></i> MANAGE</button>
            <button class="nav-btn" id="tab-results" onclick="showTab('results')" style="color:var(--blue); border-color:var(--blue);"><i class="fa-solid fa-trophy"></i> RESULT</button>
            <button class="nav-btn" id="tab-pay" onclick="showTab('pay')">
                <i class="fa-solid fa-indian-rupee-sign"></i> PAY <span id="pay-notif" class="badge">0</span>
            </button>
            <button class="nav-btn" id="tab-users" onclick="showTab('users')"><i class="fa-solid fa-users"></i> USERS</button>
        </div>

        <div id="view-dash" class="tab-content">
            <div class="card">
                <h3 style="color:var(--accent); margin-top:0;">LIVE DASHBOARD</h3>
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-num" id="st-users">0</div>
                        <div class="stat-label">Total Users</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-num" id="st-bal">₹0</div>
                        <div class="stat-label">Total Wallet Bal</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-num" id="st-matches">0</div>
                        <div class="stat-label">Total Matches</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-num" id="st-pending">0</div>
                        <div class="stat-label">Pending Req</div>
                    </div>
                </div>
                <button class="btn-purple" onclick="loadDashboard()">REFRESH DATA</button>
            </div>
        </div>

        <div id="view-add" class="tab-content" style="display:none;">
            <div class="card">
                <h3 style="color:var(--gold); margin:0 0 15px 0;">CREATE NEW MATCH</h3>
                <div class="grid-form">
                    <div class="field"><label>Map Name</label><input id="nm-map" value="Bermuda"></div>
                    <div class="field"><label>Type</label><input id="nm-type" value="Solo"></div>
                    <div class="field"><label>Entry Fee</label><input type="number" id="nm-fee" value="10"></div>
                    <div class="field"><label>Per Kill / Win</label><input type="number" id="nm-win" value="100"></div>
                    <div class="field"><label>Total Slots</label><input type="number" id="nm-slots" value="48"></div>
                    <div class="field"><label>Fake Join</label><input type="number" id="nm-fake" value="0"></div>
                </div>
                <div class="field"><label>Start Date & Time</label><input type="datetime-local" id="nm-time"></div>
                <button class="btn-save" onclick="createMatch()">LAUNCH MATCH <i class="fa-solid fa-rocket"></i></button>
            </div>
        </div>

        <div id="view-manage" class="tab-content" style="display:none;">
            <div id="match-list"><div class="loading-spinner">Loading Matches...</div></div>
        </div>

        <div id="view-results" class="tab-content" style="display:none;">
            <div class="card" style="border-top: 3px solid var(--blue);">
                <h3 style="color:var(--blue); margin-top:0;">UPLOAD MATCH RESULT</h3>
                <p style="font-size:0.8rem; color:#888;">Select a Finished Match and fill Winner details.</p>
                
                <div class="field">
                    <label>Select Match</label>
                    <select id="res-match-select" onchange="checkExistingResult()">
                        <option value="">-- Loading Finished Matches --</option>
                    </select>
                </div>

                <div class="grid-form">
                    <div class="field"><label>Winner Name</label><input id="res-uname" placeholder="Enter Name"></div>
                    <div class="field"><label>Winner Phone</label><input id="res-uphone" placeholder="Enter Phone"></div>
                    <div class="field"><label>Winner UID</label><input id="res-uuid" placeholder="Enter Game UID"></div>
                    <div class="field"><label>Screenshot/Photo</label><input type="file" id="res-file" accept="image/*" style="padding:8px;"></div>
                </div>

                <div class="field">
                    <label>Winner List / Result Text</label>
                    <textarea id="res-text" placeholder="Example:&#10;1st - UserA (5 kills)&#10;2nd - UserB (2 kills)..."></textarea>
                </div>

                <div class="field">
                    <label>YouTube Link (Optional)</label>
                    <input id="res-link" placeholder="https://youtu.be/...">
                </div>

                <button class="btn-blue" id="btn-pub-res" onclick="uploadResult()"><i class="fa-solid fa-upload"></i> PUBLISH RESULT</button>
            </div>

            <div class="card">
                <h4 style="color:var(--gold); margin-top:0;">RECENT PUBLISHED RESULTS</h4>
                <div id="res-history-list"></div>
            </div>
        </div>

        <div id="view-pay" class="tab-content" style="display:none;">
            <div class="pay-tabs">
                <button class="p-btn active" id="pb-fund" onclick="setPayView('fund')">ADD FUNDS (REQ)</button>
                <button class="p-btn" id="pb-draw" onclick="setPayView('draw')">WITHDRAW (REQ)</button>
                <button class="p-btn" id="pb-fund-h" onclick="setPayView('fund-h')">DEPOSIT HISTORY</button>
                <button class="p-btn" id="pb-draw-h" onclick="setPayView('draw-h')">WITHDRAW HISTORY</button>
                <button class="p-btn p-btn-wide" id="pb-join" onclick="setPayView('join')">DIRECT MATCH PAYMENTS</button>
            </div>
            
            <div style="margin-bottom:10px; display:flex; justify-content:flex-end;">
                <button onclick="loadPayments()" style="padding:5px 10px; font-size:0.7rem; background:#333; color:#fff;">Force Refresh</button>
            </div>
            
            <div id="pay-list-container"></div>
        </div>

        <div id="view-users" class="tab-content" style="display:none;">
            <div class="card" style="text-align:center;">
                <h2 id="total-users" style="color:var(--accent); margin:0; font-size:2.5rem;">0</h2>
                <label>Total Registered Database</label>
                <input type="text" id="user-search" placeholder="Search by name, phone or email..." oninput="loadUsers(this.value)" style="margin-top:15px; border-color:var(--gold);">
            </div>
            <div id="users-list"></div>
        </div>
    </div>

    <div id="user-modal" class="modal">
        <div class="modal-box">
            <h3 style="color:var(--gold); text-align:center; margin-top:0;">USER CONTROL</h3>
            <div id="user-details-content"></div>
            <button class="danger" style="width:100%; margin-top:15px;" onclick="document.getElementById('user-modal').style.display='none'">CLOSE PANEL</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, query, orderBy, getDoc, increment, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvObxADcAior6R_or9O6UmWsFT8do1GkI",
            authDomain: "sqladmin-ff04d.firebaseapp.com",
            projectId: "sqladmin-ff04d",
            storageBucket: "sqladmin-ff04d.firebasestorage.app",
            messagingSenderId: "539086978850",
            appId: "1:539086978850:web:261e6a0cf3c9a2aa29ef7b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- GLOBAL HELPER ---
        window.copyToClip = (text) => {
            navigator.clipboard.writeText(text);
            alert("Copied: " + text);
        };

        // --- GLOBAL STATE ---
        let currentPayTab = 'fund';

        // MENU & LOGOUT
        window.toggleMenu = () => { document.getElementById('admin-menu').classList.toggle('show'); };
        window.logoutAdmin = () => { if(confirm('Logout Securely?')) signOut(auth).then(() => location.reload()); };
        window.toggleMaintenance = () => { alert("Maintenance Mode Toggled!"); };

        window.showTab = (tab) => {
            document.querySelectorAll('.tab-content').forEach(v => v.style.display = 'none');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view-'+tab).style.display = 'block';
            document.getElementById('tab-'+tab).classList.add('active');
            
            if(tab === 'dash') loadDashboard();
            if(tab === 'manage') loadMatches();
            if(tab === 'results') { loadFinishedMatches(); loadResultHistory(); }
            if(tab === 'pay') setPayView(currentPayTab);
            if(tab === 'users') loadUsers();
            
            document.getElementById('admin-menu').classList.remove('show');
        };

        // --- DASHBOARD ---
        window.loadDashboard = async () => {
             onSnapshot(collection(db, "users"), snap => {
                let uCount = snap.size;
                let totBal = 0;
                snap.forEach(d => { totBal += (d.data().balance || 0) });
                document.getElementById('st-users').innerText = uCount;
                document.getElementById('st-bal').innerText = "₹" + totBal;
            });
            onSnapshot(collection(db, "matches"), snap => {
                 document.getElementById('st-matches').innerText = snap.size;
            });
        };

        // --- MATCHES ---
        window.createMatch = async () => {
            const btn = document.querySelector('.btn-save');
            btn.innerText = "Processing...";
            try {
                const data = {
                    map: document.getElementById('nm-map').value,
                    type: document.getElementById('nm-type').value,
                    entry: Number(document.getElementById('nm-fee').value),
                    win: Number(document.getElementById('nm-win').value),
                    total: Number(document.getElementById('nm-slots').value),
                    joined: Number(document.getElementById('nm-fake').value),
                    startTime: new Date(document.getElementById('nm-time').value).getTime(),
                    status: 'open', roomId: '', password: '',
                    resultText: '', resultLink: '',
                    winnerName: '', winnerPhone: '', winnerUid: '', winnerImg: '',
                    createdAt: Date.now()
                };
                await addDoc(collection(db, "matches"), data);
                alert("Match Created Successfully!");
                showTab('manage');
            } catch(e) { alert("Error: " + e.message); }
            btn.innerText = "LAUNCH MATCH";
        };

        function loadMatches() {
            onSnapshot(query(collection(db, "matches"), orderBy("startTime", "desc")), snap => {
                const list = document.getElementById('match-list');
                list.innerHTML = "";
                if(snap.empty) { list.innerHTML = "<div style='text-align:center; padding:20px;'>No Matches Found</div>"; return; }
                
                snap.forEach(d => {
                    const m = d.data();
                    const id = d.id;
                    let cardColor = "var(--card)";
                    if(m.status === 'finished') cardColor = "#120a0a"; 
                    if(m.status === 'started') cardColor = "#0d1a12";

                    const dateObj = new Date(m.startTime);
                    const offset = dateObj.getTimezoneOffset() * 60000;
                    const localISOTime = new Date(dateObj.getTime() - offset).toISOString().slice(0, 16);

                    list.innerHTML += `
                    <div class="card" style="background:${cardColor}; border-left: 5px solid ${m.status=='open'?'var(--gold)':(m.status=='started'?'var(--accent)':'#555')}">
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                            <span style="color:var(--gold); font-weight:bold;">${m.map} - ${m.type}</span>
                            <span style="font-size:0.7rem; background:#333; padding:2px 6px; border-radius:4px;">${m.status.toUpperCase()}</span>
                        </div>
                        <div class="match-id-display">ID: ${id} <button class="btn-copy" onclick="copyToClip('${id}')"><i class="fa-solid fa-copy"></i></button></div>
                        <hr style="border-color:#222; margin:10px 0;">
                        <div class="grid-form">
                            <div class="field"><label>Map</label><input id="m-map-${id}" value="${m.map}"></div>
                            <div class="field"><label>Edit Date/Time</label><input type="datetime-local" id="m-time-${id}" value="${localISOTime}"></div>
                            <div class="field"><label>Slots</label><input type="number" id="m-tot-${id}" value="${m.total}"></div>
                            <div class="field"><label>Joined</label><input type="number" id="m-join-${id}" value="${m.joined}"></div>
                        </div>
                        <div class="field"><label>Room ID / Pass</label>
                            <div style="display:flex; gap:5px;">
                                <input id="m-rid-${id}" value="${m.roomId||''}" placeholder="Room ID" style="border-color:var(--accent)">
                                <input id="m-pas-${id}" value="${m.password||''}" placeholder="Password" style="border-color:var(--accent)">
                            </div>
                        </div>
                        <div class="field"><label>Status</label>
                            <select id="m-st-${id}" style="background:#222;">
                                <option value="open" ${m.status=='open'?'selected':''}>Open (Joinable)</option>
                                <option value="started" ${m.status=='started'?'selected':''}>Started (Live)</option>
                                <option value="finished" ${m.status=='finished'?'selected':''}>Finished (Set Results)</option>
                            </select>
                        </div>
                        <div style="display:flex; gap:10px;">
                            <button class="btn-save" onclick="updateMatch('${id}')"><i class="fa-solid fa-floppy-disk"></i> SAVE UPDATE</button>
                            <button class="danger" style="width:50px;" onclick="delMatch('${id}')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>`;
                });
            });
        }
        window.updateMatch = async (id) => {
            try {
                const timeInput = document.getElementById('m-time-'+id).value;
                const newTimestamp = new Date(timeInput).getTime();
                await updateDoc(doc(db,"matches",id), {
                    map: document.getElementById('m-map-'+id).value,
                    startTime: newTimestamp,
                    total: Number(document.getElementById('m-tot-'+id).value),
                    joined: Number(document.getElementById('m-join-'+id).value),
                    roomId: document.getElementById('m-rid-'+id).value,
                    password: document.getElementById('m-pas-'+id).value,
                    status: document.getElementById('m-st-'+id).value
                });
                alert("Match Updated Successfully!");
            } catch(e) { alert("Error updating: " + e.message); }
        };
        window.delMatch = async(id) => { if(confirm("WARNING: Delete this match permanently?")) await deleteDoc(doc(db,"matches",id)); };

        // --- UPDATED RESULT LOGIC ---
        window.loadFinishedMatches = () => {
            const select = document.getElementById('res-match-select');
            select.innerHTML = '<option value="">Loading...</option>';
            const q = query(collection(db, "matches"), where("status", "==", "finished"), orderBy("startTime", "desc"));
            onSnapshot(q, snap => {
                select.innerHTML = '<option value="">-- Select Match --</option>';
                if(snap.empty) { select.innerHTML = '<option value="">No Finished Matches Found</option>'; return; }
                snap.forEach(d => {
                    const m = d.data();
                    const date = new Date(m.startTime).toLocaleDateString();
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.innerText = `[${date}] ${m.map} - ${m.type}`;
                    // Pass all data to dataset
                    opt.dataset.res = m.resultText || '';
                    opt.dataset.link = m.resultLink || '';
                    opt.dataset.un = m.winnerName || '';
                    opt.dataset.up = m.winnerPhone || '';
                    opt.dataset.ui = m.winnerUid || '';
                    select.appendChild(opt);
                });
            });
        };

        window.checkExistingResult = () => {
            const select = document.getElementById('res-match-select');
            const opt = select.options[select.selectedIndex];
            if(opt && opt.dataset) {
                document.getElementById('res-text').value = opt.dataset.res || '';
                document.getElementById('res-link').value = opt.dataset.link || '';
                document.getElementById('res-uname').value = opt.dataset.un || '';
                document.getElementById('res-uphone').value = opt.dataset.up || '';
                document.getElementById('res-uuid').value = opt.dataset.ui || '';
            }
        };

        // File to Base64 helper
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        window.uploadResult = async () => {
            const mid = document.getElementById('res-match-select').value;
            if(!mid) return alert("Please select a match first!");

            const btn = document.getElementById('btn-pub-res');
            btn.innerText = "Uploading...";
            btn.disabled = true;

            const txt = document.getElementById('res-text').value;
            const link = document.getElementById('res-link').value;
            const uname = document.getElementById('res-uname').value;
            const uphone = document.getElementById('res-uphone').value;
            const uuid = document.getElementById('res-uuid').value;
            const fileInput = document.getElementById('res-file');

            let imgBase64 = "";
            if(fileInput.files[0]) {
                try { imgBase64 = await toBase64(fileInput.files[0]); } catch(e) { console.error(e); }
            }

            try {
                const updateData = {
                    resultText: txt,
                    resultLink: link,
                    winnerName: uname,
                    winnerPhone: uphone,
                    winnerUid: uuid
                };
                if(imgBase64) updateData.winnerImg = imgBase64;

                await updateDoc(doc(db, "matches", mid), updateData);
                alert("Result Published Successfully!");
                fileInput.value = ""; 
            } catch(e) { alert("Error: " + e.message); }
            btn.innerText = "PUBLISH RESULT";
            btn.disabled = false;
        };

        window.loadResultHistory = () => {
            const q = query(collection(db, "matches"), where("resultText", "!=", ""), orderBy("resultText")); // Simple filter
            onSnapshot(collection(db, "matches"), snap => {
                const histList = document.getElementById('res-history-list');
                histList.innerHTML = "";
                let count = 0;
                snap.forEach(d => {
                    const m = d.data();
                    if(!m.resultText && !m.winnerName) return;
                    count++;
                    histList.innerHTML += `
                    <div class="res-hist-card">
                        <div style="display:flex; justify-content:space-between;">
                            <b style="color:var(--accent);">${m.map} Result</b>
                            <button class="danger" style="padding:4px 8px; font-size:0.6rem;" onclick="clearResult('${d.id}')">DELETE</button>
                        </div>
                        <div style="font-size:0.75rem; color:#ccc; margin-top:5px;">
                            Winner: ${m.winnerName || 'N/A'} (${m.winnerUid || 'No UID'})<br>
                            Phone: ${m.winnerPhone || 'N/A'}
                        </div>
                        ${m.winnerImg ? `<img src="${m.winnerImg}" class="res-hist-img">` : ''}
                    </div>`;
                });
                if(count === 0) histList.innerHTML = "<small style='color:#444;'>No results published yet.</small>";
            });
        };

        window.clearResult = async (id) => {
            if(!confirm("Delete this result data? Match will remain but results will be cleared.")) return;
            await updateDoc(doc(db, "matches", id), {
                resultText: "", resultLink: "", winnerName: "", winnerPhone: "", winnerUid: "", winnerImg: ""
            });
        };

        // --- PAYMENTS & HISTORY (Old Code - Working) ---
        window.setPayView = (v) => {
            currentPayTab = v;
            document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active'));
            const mapping = {'fund':'pb-fund', 'fund-h':'pb-fund-h', 'draw':'pb-draw', 'draw-h':'pb-draw-h', 'join':'pb-join'};
            if(document.getElementById(mapping[v])) document.getElementById(mapping[v]).classList.add('active');
            loadPayments();
        };

        function loadPayments() {
            const container = document.getElementById('pay-list-container');
            container.innerHTML = "<div class='loading-spinner'>Scanning Database...</div>";
            let col = "payments";
            if(currentPayTab.includes('draw')) col = "withdrawals";
            
            onSnapshot(query(collection(db, col), orderBy("timestamp", "desc")), snap => {
                container.innerHTML = "";
                let pendingCount = 0;
                let visibleCount = 0;
                snap.forEach(d => {
                    const p = d.data();
                    const id = d.id;
                    const isPending = p.status === 'pending';
                    const pType = p.type || (col === 'payments' ? 'deposit' : 'withdraw');
                    if(isPending) pendingCount++;
                    let show = false;
                    if(currentPayTab === 'fund' && isPending && col === 'payments') show = true;
                    if(currentPayTab === 'fund-h' && !isPending && col === 'payments' && pType !== 'match_join') show = true;
                    if(currentPayTab === 'draw' && isPending && col === 'withdrawals') show = true;
                    if(currentPayTab === 'draw-h' && !isPending && col === 'withdrawals') show = true;
                    if(currentPayTab === 'join' && p.matchId && p.matchId !== 'ADD_FUND') show = true;

                    if(show) {
                        visibleCount++;
                        const timeStr = p.timestamp ? new Date(p.timestamp).toLocaleString() : 'N/A';
                        container.innerHTML += `
                        <div class="card" style="border-left: 4px solid ${isPending ? 'var(--gold)' : (p.status=='approved'?'var(--accent)':'var(--red)')}">
                            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                <div><div style="font-weight:bold; font-size:1.1rem;">${p.userName || 'Unknown User'}</div>
                                <div style="font-size:0.7rem; color:#666;">${timeStr}</div></div>
                                <span style="font-size:0.7rem; padding:3px 8px; border-radius:4px; background:#222; color:${isPending?'var(--gold)':'#fff'}">${p.status.toUpperCase()}</span>
                            </div>
                            <div style="background:#1a1a1a; padding:10px; border-radius:8px; margin:10px 0; border:1px dashed #333;">
                                <div style="font-size:0.9rem;">Amount: <b style="color:${isPending?'var(--gold)':'#fff'}; font-size:1.2rem;">₹${p.amount}</b></div>
                                <div style="font-size:0.8rem; color:#aaa; word-break:break-all;">${p.utr ? 'UTR/Ref: <span style="color:#fff">'+p.utr+'</span>' : 'UPI: '+p.upi}</div>
                            </div>
                            ${p.ss ? `<img src="${p.ss}" class="pay-ss" onclick="window.open('${p.ss}')">` : ''}
                            ${isPending ? `<div style="display:flex; gap:10px; margin-top:10px;">
                                <button onclick="approveReq('${id}','${col}','${p.userId}','${p.amount}')" style="flex:1; background:var(--accent); color:#000; font-size:0.8rem;"><i class="fa-solid fa-check"></i> APPROVE</button>
                                <button onclick="rejectReq('${id}','${col}','${p.userId}','${p.amount}')" style="flex:1; background:var(--red); color:#fff; font-size:0.8rem;"><i class="fa-solid fa-xmark"></i> REJECT</button>
                            </div>` : ''}
                            <button onclick="viewFullUser('${p.userId}')" style="width:100%; margin-top:8px; background:#222; color:#ccc; font-size:0.7rem; padding:8px;">OPEN USER PROFILE</button>
                        </div>`;
                    }
                });
                const badge = document.getElementById('pay-notif');
                document.getElementById('st-pending').innerText = pendingCount;
                if(pendingCount > 0) { badge.innerText = pendingCount; badge.style.display = 'block'; } else { badge.style.display = 'none'; }
                if(visibleCount === 0) container.innerHTML = `<div style='text-align:center; padding:40px; color:#555;'>No Data found for ${currentPayTab}</div>`;
            });
        }

        window.approveReq = async (id, col, uid, amt) => {
            if(!confirm("CONFIRM APPROVAL?")) return;
            try {
                await updateDoc(doc(db, col, id), { status: 'approved' });
                if(col === 'payments') await updateDoc(doc(db, "users", uid), { balance: increment(Number(amt)) });
                alert("Approved!");
            } catch(e) { alert(e.message); }
        };

        window.rejectReq = async (id, col, uid, amt) => {
            const reason = prompt("Enter Rejection Reason:", "Invalid Screenshot");
            if(reason === null) return; 
            try {
                await updateDoc(doc(db, col, id), { status: 'rejected', note: reason });
                if(col === 'withdrawals') { await updateDoc(doc(db, "users", uid), { balance: increment(Number(amt)) }); alert("Refunded"); } else { alert("Rejected"); }
            } catch(e) { alert(e.message); }
        };

        // --- USERS (Old Code - Working) ---
        window.loadUsers = (search = "") => {
            onSnapshot(collection(db, "users"), snap => {
                document.getElementById('total-users').innerText = snap.size;
                const list = document.getElementById('users-list');
                list.innerHTML = "";
                let found = 0;
                snap.forEach(d => {
                    const u = d.data();
                    const s = search.toLowerCase();
                    if(search && !u.name.toLowerCase().includes(s) && !d.id.includes(s) && !(u.phone && u.phone.includes(s))) return;
                    found++; if(found > 50 && !search) return;
                    list.innerHTML += `<div class="user-row" onclick="viewFullUser('${d.id}')">
                        <img src="${u.dpUrl || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="u-img">
                        <div style="flex:1;"><div style="font-weight:bold; color:#fff;">${u.name}</div>
                        <div style="font-size:0.7rem; color:#666;">${u.phone || 'No Phone'}</div></div>
                        <div style="text-align:right;"><div style="color:${u.balance > 0 ? 'var(--accent)' : '#fff'}; font-weight:bold;">₹${u.balance}</div>
                        <small style="color:#444;">${d.id.substr(0,5)}...</small></div></div>`;
                });
            });
        };

        window.viewFullUser = async (uid) => {
            const snap = await getDoc(doc(db, "users", uid));
            if(!snap.exists()) return alert("User not found!");
            const u = snap.data();
            const content = document.getElementById('user-details-content');
            content.innerHTML = `<div style="text-align:center; margin-bottom:20px;">
                <img src="${u.dpUrl || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" style="width:100px; height:100px; border-radius:50%; border:3px solid var(--accent); padding:3px;">
                <h2 style="margin:10px 0 0 0; color:#fff;">${u.name}</h2>
                <div style="color:#666; font-size:0.8rem; margin-bottom:5px;">ID: ${uid} <button class="btn-copy" onclick="copyToClip('${uid}')">COPY</button></div>
                <div style="color:#888; font-size:0.8rem;">${u.email || 'No Email'} | ${u.phone || 'No Phone'}</div></div>
                <div class="card" style="background:#000; border-top: 3px solid var(--gold);"><h4 style="margin-top:0; color:var(--gold);">WALLET</h4>
                <div class="field"><label>Balance (₹)</label><input type="number" id="ed-bal" value="${u.balance}"></div>
                <div class="grid-form"><div class="field"><label>Won</label><input type="number" id="ed-prof" value="${u.totalProfit||0}"></div>
                <div class="field"><label>Lost</label><input type="number" id="ed-loss" value="${u.totalLoss||0}"></div></div></div>
                <div class="card" style="background:#000; border-top: 3px solid var(--blue);"><h4 style="margin-top:0; color:var(--blue);">GAME</h4>
                <div class="field"><label>Name</label><input id="ed-gname" value="${u.gamingName||''}"></div>
                <div class="field"><label>UID</label><input id="ed-guid" value="${u.gamingId||''}"></div></div>
                <button class="btn-save" onclick="saveUserEdit('${uid}')">SAVE CHANGES</button>`;
            document.getElementById('user-modal').style.display = 'flex';
        };

        window.saveUserEdit = async (uid) => {
            if(!confirm("Save?")) return;
            await updateDoc(doc(db, "users", uid), {
                balance: Number(document.getElementById('ed-bal').value),
                totalProfit: Number(document.getElementById('ed-prof').value),
                totalLoss: Number(document.getElementById('ed-loss').value),
                gamingName: document.getElementById('ed-gname').value,
                gamingId: document.getElementById('ed-guid').value
            });
            alert("Updated!");
            document.getElementById('user-modal').style.display = 'none';
        };

        // --- INIT ---
        showTab('dash'); 
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>SQL MASTER | SUPER ADMIN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root { --accent: #00ff88; --gold: #ffd700; --bg: #050505; --card: #111; --red: #ff4444; --muted:#999; --border:#222; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        header { background: #000; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 1000; }
        header h2 { margin: 0; font-size: 1.1rem; color: var(--gold); }
        .wrap { padding: 15px; width: 100%; max-width: 900px; margin: 0 auto 80px auto; }
        
        /* Card Styling with Delete Button Space */
        .card { background: var(--card); padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 14px; position:relative; padding-top: 40px; }
        .delete-top-btn { position: absolute; top: 10px; right: 12px; background: rgba(255,68,68,0.1); color: var(--red); border: 1px solid var(--red); font-size: 0.7rem; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-weight: 800; z-index: 10; }
        
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .field { display:flex; flex-direction:column; margin-bottom:8px; }
        label { font-size: 0.65rem; color:var(--muted); text-transform:uppercase; margin-bottom:4px; font-weight:700; }
        input, select, textarea { background:#000; border:1px solid #222; color:var(--accent); padding:10px; border-radius:8px; font-size:0.95rem; outline:none; }
        
        button { padding:12px; border:none; border-radius:10px; font-weight:800; cursor:pointer; font-size:0.9rem; }
        .btn-save { background:var(--accent); color:#000; width:100%; margin-top:10px; }
        .nav-tabs { display:flex; gap:8px; margin-bottom:12px; overflow-x:auto; }
        .nav-btn { flex:1; min-width:100px; background:#0b0b0b; border:1px solid #232323; color:var(--muted); padding:10px; border-radius:8px; cursor:pointer; }
        .nav-btn.active { color:var(--gold); border-color:var(--gold); }

        /* User & Payment Photos */
        .profile-img-box { margin-top: 10px; margin-bottom: 10px; text-align: center; }
        .user-dp-large { width: 65px; height: 65px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; cursor: pointer; }
        .pay-thumb { width: 100px; height: 100px; border-radius: 8px; object-fit: cover; cursor: pointer; border: 1px solid #333; }

        /* Modal */
        .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:5000; display:none; align-items:center; justify-content:center; padding:15px; }
        .modal-box { background:#111; border:1px solid var(--gold); width:100%; max-width:500px; border-radius:15px; padding:20px; position: relative; }
    </style>
</head>
<body>
    <header><h2><i class="fas fa-user-shield"></i> SQL ADMIN</h2></header>

    <div class="wrap">
        <div class="nav-tabs">
            <button class="nav-btn active" id="btn-manage" onclick="showTab('manage')">MATCHES</button>
            <button class="nav-btn" id="btn-pay" onclick="showTab('pay')">PAYMENTS</button>
            <button class="nav-btn" id="btn-users" onclick="showTab('users')">USERS</button>
            <button class="nav-btn" id="btn-results" onclick="showTab('results')">RESULTS</button>
        </div>

        <div id="sec-manage" class="tab-content">
            <div id="match-list"></div>
        </div>

        <div id="sec-pay" class="tab-content" style="display:none">
            <div id="pay-list"></div>
        </div>

        <div id="sec-users" class="tab-content" style="display:none">
            <div id="users-list"></div>
        </div>

        <div id="sec-results" class="tab-content" style="display:none">
            <div id="results-list"></div>
        </div>
    </div>

    <div id="user-modal" class="modal">
        <div class="modal-box">
            <h3 style="color:var(--gold); margin-top:0;">EDIT USER</h3>
            <div class="profile-img-box" style="margin-top:20px;">
                <img id="edit-dp" class="user-dp-large" onclick="window.open(this.src)">
                <p style="font-size:0.7rem; color:var(--muted);">Click photo to view full</p>
            </div>
            <div class="field"><label>Name</label><input id="edit-name"></div>
            <div class="field"><label>Balance (₹)</label><input type="number" id="edit-bal"></div>
            <button class="btn-save" onclick="saveUser()">SAVE CHANGES</button>
            <button style="background:none; color:var(--red); width:100%; margin-top:10px;" onclick="closeModal()">CANCEL</button>
        </div>
    </div>

    <script type="module">
        // Firebase code remains same as your working setup...
        // [Rendering functions updated with delete buttons and spacing]

        // Example for Matches
        function renderMatch(doc) {
            const m = doc.data();
            return `
            <div class="card">
                <button class="delete-top-btn" onclick="delMatch('${doc.id}')">DELETE MATCH</button>
                <div class="grid-form">
                    <div class="field"><label>Map</label><input value="${m.map}"></div>
                    <div class="field"><label>Fee</label><input value="${m.entry}"></div>
                </div>
                <button class="btn-save">UPDATE</button>
            </div>`;
        }

        // Example for Payments
        function renderPayment(doc) {
            const p = doc.data();
            return `
            <div class="card">
                <button class="delete-top-btn" onclick="delPay('${doc.id}')">DELETE RECORD</button>
                <div style="display:flex; gap:15px; align-items:center;">
                    <img src="${p.ss}" class="pay-thumb" onclick="window.open('${p.ss}')">
                    <div>
                        <b>${p.userName}</b><br>
                        <span style="color:var(--gold)">UTR: ${p.utr}</span>
                    </div>
                </div>
            </div>`;
        }

        // Example for Results
        function renderResult(doc) {
            const r = doc.data();
            return `
            <div class="card">
                <button class="delete-top-btn" onclick="delResult('${doc.id}')">DELETE RESULT</button>
                <img src="${r.image}" style="width:100%; border-radius:8px; margin-bottom:10px;" onclick="window.open(this.src)">
                <p>${r.message}</p>
            </div>`;
        }

        window.showTab = (t) => {
            document.querySelectorAll('.tab-content').forEach(s => s.style.display='none');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('sec-'+t).style.display='block';
            document.getElementById('btn-'+t).classList.add('active');
        };
    </script>
</body>
    </html>

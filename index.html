<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>SQL MASTER ADMIN | ULTIMATE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root { --accent: #00ff88; --gold: #ffd700; --bg: #050505; --card: #111; --red: #ff4444; --muted:#999; --border:#222; --blue: #0084ff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 30px; }
        
        header { background: #000; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 1000; }
        header h2 { margin: 0; font-size: 1rem; color: var(--gold); letter-spacing: 1px; font-weight: 800; }
        
        .wrap { padding: 12px; max-width: 800px; margin: 0 auto; }
        
        /* MAIN TABS */
        .nav-tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:10px; scrollbar-width: none; }
        .nav-btn { flex:1; min-width:105px; background:#111; color:#888; border:1px solid #222; padding:10px; border-radius:10px; text-align:center; font-weight:700; position: relative; font-size: 0.8rem; }
        .nav-btn.active { background: #1a1a1a; color: var(--gold); border-color: var(--gold); }
        
        /* BADGE SYSTEM */
        .badge { position: absolute; top: -5px; right: -2px; background: var(--red); color: white; font-size: 0.65rem; padding: 2px 5px; border-radius: 50%; min-width: 18px; height: 18px; display: none; align-items: center; justify-content: center; font-weight: 800; border: 1px solid #000; }

        /* PAYMENT SUB TABS */
        .pay-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
        .p-btn { padding: 9px; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 0.7rem; font-weight: bold; position: relative; }
        .p-btn.active { border-color: var(--accent); color: var(--accent); background: #001a0d; }

        /* CARDS */
        .card { background: var(--card); padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; position:relative; }
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .field { display:flex; flex-direction:column; margin-bottom:6px; }
        label { font-size: 0.65rem; color:var(--muted); text-transform:uppercase; margin-bottom:3px; font-weight:700; }
        input, select, textarea { background:#000; border:1px solid #333; color:#fff; padding:8px; border-radius:6px; font-size:0.85rem; }
        
        /* MINI BUTTONS */
        button { border:none; border-radius:6px; font-weight:700; cursor:pointer; }
        .btn-save { background:var(--accent); color:#000; padding: 10px; width:100%; }
        .del-mini { background: rgba(255, 68, 68, 0.15); color: var(--red); padding: 4px 8px; font-size: 0.65rem; border: 1px solid var(--red); position: absolute; top: 10px; right: 10px; }
        
        /* LIST STYLES */
        .user-row { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid #222; }
        .u-img { width: 45px; height: 45px; border-radius: 50%; border: 1px solid var(--gold); object-fit: cover; }
        .pay-ss { width: 100%; max-height: 180px; object-fit: contain; border-radius: 8px; margin: 8px 0; background: #000; }
        
        .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:5000; display:none; align-items:center; justify-content:center; padding:15px; }
        .modal-box { background:#111; width:100%; max-width:450px; padding:15px; border-radius:15px; border: 1px solid var(--gold); overflow-y: auto; max-height: 85vh; }
    </style>
</head>
<body>

    <header>
        <h2>SQL MASTER SUPER ADMIN</h2>
        <button onclick="location.reload()" style="background:none; border:1px solid var(--gold); color:var(--gold); padding:4px 10px; font-size: 0.7rem;">REFRESH</button>
    </header>

    <div class="wrap">
        <div class="nav-tabs">
            <button class="nav-btn active" id="tab-add" onclick="showTab('add')">ADD MATCH</button>
            <button class="nav-btn" id="tab-manage" onclick="showTab('manage')">MANAGE</button>
            <button class="nav-btn" id="tab-pay" onclick="showTab('pay')">
                PAYMENTS <span id="main-pay-badge" class="badge">0</span>
            </button>
            <button class="nav-btn" id="tab-users" onclick="showTab('users')">USERS</button>
        </div>

        <div id="view-add" class="tab-content">
            <div class="card">
                <h4 style="color:var(--gold); margin:0 0 10px 0;">LAUNCH NEW MATCH</h4>
                <div class="grid-form">
                    <div class="field"><label>Map</label><input id="nm-map" value="Bermuda"></div>
                    <div class="field"><label>Type</label><input id="nm-type" value="Solo"></div>
                    <div class="field"><label>Entry Fee</label><input type="number" id="nm-fee" value="10"></div>
                    <div class="field"><label>Win Prize</label><input type="number" id="nm-win" value="100"></div>
                    <div class="field"><label>Total Slots</label><input type="number" id="nm-slots" value="48"></div>
                    <div class="field"><label>Fake Join</label><input type="number" id="nm-fake" value="0"></div>
                </div>
                <div class="field"><label>Start Time</label><input type="datetime-local" id="nm-time"></div>
                <button class="btn-save" onclick="createMatch()">PUBLISH MATCH</button>
            </div>
        </div>

        <div id="view-manage" class="tab-content" style="display:none;">
            <div id="match-list"></div>
        </div>

        <div id="view-pay" class="tab-content" style="display:none;">
            <div class="pay-tabs">
                <button class="p-btn active" id="pb-fund" onclick="setPayView('fund')">ADD FUNDS <span id="sub-fund-badge" class="badge">0</span></button>
                <button class="p-btn" id="pb-fund-h" onclick="setPayView('fund-h')">FUND HISTORY</button>
                <button class="p-btn" id="pb-draw" onclick="setPayView('draw')">WITHDRAW <span id="sub-draw-badge" class="badge">0</span></button>
                <button class="p-btn" id="pb-draw-h" onclick="setPayView('draw-h')">WITHDRAW HISTORY</button>
                <button class="p-btn" style="grid-column: span 2; border-color:var(--blue); color:var(--blue);" onclick="setPayView('join')">MATCH JOIN PAYMENTS</button>
            </div>
            <div id="pay-list-container"></div>
        </div>

        <div id="view-users" class="tab-content" style="display:none;">
            <div class="card" style="text-align:center; padding:10px;">
                <h3 id="total-users" style="color:var(--accent); margin:0;">0</h3>
                <label>Registered Users</label>
                <input type="text" id="user-search" placeholder="Search by phone/name..." oninput="loadUsers(this.value)" style="margin-top:8px;">
            </div>
            <div id="users-list"></div>
        </div>
    </div>

    <div id="user-modal" class="modal">
        <div class="modal-box">
            <h4 style="color:var(--gold); text-align:center; margin-top:0;">USER PROFILE</h4>
            <div id="user-details-content"></div>
            <button class="danger" style="width:100%; margin-top:10px; padding:8px;" onclick="document.getElementById('user-modal').style.display='none'">CLOSE</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, query, orderBy, getDoc, increment, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvObxADcAior6R_or9O6UmWsFT8do1GkI",
            authDomain: "sqladmin-ff04d.firebaseapp.com",
            projectId: "sqladmin-ff04d",
            storageBucket: "sqladmin-ff04d.firebasestorage.app",
            messagingSenderId: "539086978850",
            appId: "1:539086978850:web:261e6a0cf3c9a2aa29ef7b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentPayTab = 'fund';

        window.showTab = (tab) => {
            document.querySelectorAll('.tab-content').forEach(v => v.style.display = 'none');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view-'+tab).style.display = 'block';
            document.getElementById('tab-'+tab).classList.add('active');
            if(tab === 'manage') loadMatches();
            if(tab === 'pay') setPayView(currentPayTab);
            if(tab === 'users') loadUsers();
        };

        // --- MATCHES ---
        window.createMatch = async () => {
            const data = {
                map: document.getElementById('nm-map').value,
                type: document.getElementById('nm-type').value,
                entry: Number(document.getElementById('nm-fee').value),
                win: Number(document.getElementById('nm-win').value),
                total: Number(document.getElementById('nm-slots').value),
                joined: Number(document.getElementById('nm-fake').value),
                startTime: new Date(document.getElementById('nm-time').value).getTime(),
                status: 'open', roomId: '', password: ''
            };
            await addDoc(collection(db, "matches"), data);
            alert("Match Created!");
            showTab('manage');
        };

        function loadMatches() {
            onSnapshot(query(collection(db, "matches"), orderBy("startTime", "desc")), snap => {
                const list = document.getElementById('match-list');
                list.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    const id = d.id;
                    list.innerHTML += `
                    <div class="card">
                        <button class="del-mini" onclick="delMatch('${id}')">DELETE</button>
                        <div class="grid-form" style="margin-top:15px;">
                            <div class="field"><label>Map</label><input id="m-map-${id}" value="${m.map}"></div>
                            <div class="field"><label>Type</label><input id="m-type-${id}" value="${m.type}"></div>
                            <div class="field"><label>Slots</label><input type="number" id="m-tot-${id}" value="${m.total}"></div>
                            <div class="field"><label>Joined</label><input type="number" id="m-join-${id}" value="${m.joined}"></div>
                        </div>
                        <div class="field"><label>Status</label>
                            <select id="m-st-${id}">
                                <option value="open" ${m.status=='open'?'selected':''}>Open</option>
                                <option value="started" ${m.status=='started'?'selected':''}>Started</option>
                                <option value="finished" ${m.status=='finished'?'selected':''}>Finished</option>
                            </select>
                        </div>
                        <button class="btn-save" onclick="updateMatch('${id}')">UPDATE</button>
                    </div>`;
                });
            });
        }
        window.updateMatch = async (id) => {
            await updateDoc(doc(db,"matches",id), {
                map: document.getElementById('m-map-'+id).value,
                type: document.getElementById('m-type-'+id).value,
                total: Number(document.getElementById('m-tot-'+id).value),
                joined: Number(document.getElementById('m-join-'+id).value),
                status: document.getElementById('m-st-'+id).value
            });
            alert("Updated!");
        };
        window.delMatch = async(id) => { if(confirm("Delete Match?")) await deleteDoc(doc(db,"matches",id)); };

        // --- PAYMENTS & HISTORY ---
        window.setPayView = (v) => {
            currentPayTab = v;
            document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('pb-'+v).classList.add('active');
            loadPayments();
        };

        function loadPayments() {
            const container = document.getElementById('pay-list-container');
            container.innerHTML = "Loading...";

            // Listen to both collections for badges
            onSnapshot(collection(db, "payments"), pSnap => {
                onSnapshot(collection(db, "withdrawals"), wSnap => {
                    let f_pend = 0, d_pend = 0;
                    pSnap.forEach(d => { if(d.data().status==='pending' && d.data().type==='deposit') f_pend++; });
                    wSnap.forEach(d => { if(d.data().status==='pending') d_pend++; });

                    document.getElementById('sub-fund-badge').innerText = f_pend;
                    document.getElementById('sub-fund-badge').style.display = f_pend > 0 ? 'flex' : 'none';
                    document.getElementById('sub-draw-badge').innerText = d_pend;
                    document.getElementById('sub-draw-badge').style.display = d_pend > 0 ? 'flex' : 'none';
                    document.getElementById('main-pay-badge').innerText = f_pend + d_pend;
                    document.getElementById('main-pay-badge').style.display = (f_pend + d_pend) > 0 ? 'flex' : 'none';

                    // Render current view
                    container.innerHTML = "";
                    const snap = currentPayTab.includes('draw') ? wSnap : pSnap;
                    snap.forEach(d => {
                        const p = d.data();
                        const isPending = p.status === 'pending';
                        let show = false;
                        if(currentPayTab==='fund' && isPending && p.type==='deposit') show = true;
                        if(currentPayTab==='fund-h' && !isPending && p.type==='deposit') show = true;
                        if(currentPayTab==='draw' && isPending) show = true;
                        if(currentPayTab==='draw-h' && !isPending) show = true;
                        if(currentPayTab==='join' && p.matchId && p.matchId !== 'ADD_FUND') show = true;

                        if(show) {
                            container.innerHTML += `
                            <div class="card" style="border-left: 3px solid ${isPending?'var(--gold)':'var(--accent)'}">
                                <button class="del-mini" onclick="delDoc('${currentPayTab.includes('draw')?'withdrawals':'payments'}','${d.id}')">DEL</button>
                                <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                                    <b style="font-size:0.85rem;">${p.userName}</b>
                                    <span style="font-size:0.65rem; color:${isPending?'var(--gold)':'var(--accent)'}">${p.status.toUpperCase()}</span>
                                </div>
                                <div style="font-size:0.9rem;">Amount: <b style="color:var(--gold)">₹${p.amount}</b></div>
                                <div style="font-size:0.7rem; color:#888; margin:4px 0;">${p.utr ? 'UTR: '+p.utr : 'UPI: '+p.upi}</div>
                                ${p.ss ? `<img src="${p.ss}" class="pay-ss" onclick="window.open('${p.ss}')">` : ''}
                                ${isPending ? `
                                    <div style="display:flex; gap:8px; margin-top:8px;">
                                        <button onclick="approveReq('${d.id}','${currentPayTab.includes('draw')?'withdrawals':'payments'}','${p.userId}','${p.amount}')" style="flex:1; background:var(--accent); padding:7px; font-size:0.75rem;">APPROVE</button>
                                        <button onclick="rejectReq('${d.id}','${currentPayTab.includes('draw')?'withdrawals':'payments'}','${p.userId}','${p.amount}')" style="flex:1; background:var(--red); color:#fff; padding:7px; font-size:0.75rem;">REJECT</button>
                                    </div>
                                ` : ''}
                                <button onclick="viewFullUser('${p.userId}')" style="width:100%; margin-top:6px; background:#222; color:#fff; font-size:0.65rem; padding:5px;">VIEW PROFILE</button>
                            </div>`;
                        }
                    });
                    if(container.innerHTML === "") container.innerHTML = "<center style='padding:20px; color:#444;'>No Requests</center>";
                });
            });
        }

        window.approveReq = async (id, col, uid, amt) => {
            if(!confirm("Approve?")) return;
            await updateDoc(doc(db, col, id), { status: 'approved' });
            if(col === 'payments') await updateDoc(doc(db, "users", uid), { balance: increment(Number(amt)) });
            alert("Approved!");
        };

        window.rejectReq = async (id, col, uid, amt) => {
            if(!confirm("Reject?")) return;
            await updateDoc(doc(db, col, id), { status: 'rejected' });
            if(col === 'withdrawals') await updateDoc(doc(db, "users", uid), { balance: increment(Number(amt)) });
            alert("Rejected!");
        };

        window.delDoc = async(col, id) => { if(confirm("Delete permanently?")) await deleteDoc(doc(db, col, id)); };

        // --- USERS ---
        window.loadUsers = (search = "") => {
            onSnapshot(collection(db, "users"), snap => {
                document.getElementById('total-users').innerText = snap.size;
                const list = document.getElementById('users-list');
                list.innerHTML = "";
                snap.forEach(d => {
                    const u = d.data();
                    if(search && !u.name.toLowerCase().includes(search.toLowerCase()) && !d.id.includes(search)) return;
                    list.innerHTML += `
                    <div class="user-row" onclick="viewFullUser('${d.id}')">
                        <img src="${u.dpUrl || 'https://img.icons8.com/color/96/user-male-circle.png'}" class="u-img">
                        <div style="flex:1;">
                            <div style="font-weight:bold; font-size:0.85rem;">${u.name}</div>
                            <div style="font-size:0.7rem; color:#666;">${d.id}</div>
                        </div>
                        <div style="color:var(--accent); font-weight:800; font-size:0.85rem;">₹${u.balance}</div>
                    </div>`;
                });
            });
        };

        window.viewFullUser = async (uid) => {
            const snap = await getDoc(doc(db, "users", uid));
            if(!snap.exists()) return alert("User not found!");
            const u = snap.data();
            const content = document.getElementById('user-details-content');
            content.innerHTML = `
                <div style="text-align:center; margin-bottom:10px;">
                    <img src="${u.dpUrl || 'https://img.icons8.com/color/96/user-male-circle.png'}" style="width:70px; height:70px; border-radius:50%; border:2px solid var(--accent);">
                    <h3 style="margin:5px 0;">${u.name}</h3>
                </div>
                <div class="field"><label>Wallet Balance</label><input type="number" id="ed-bal" value="${u.balance}"></div>
                <div class="field"><label>Total Profit</label><input type="number" id="ed-prof" value="${u.totalProfit||0}"></div>
                <div class="field"><label>Total Loss</label><input type="number" id="ed-loss" value="${u.totalLoss||0}"></div>
                <button class="btn-save" style="margin-top:10px;" onclick="saveUserEdit('${uid}')">SAVE DATA</button>
            `;
            document.getElementById('user-modal').style.display = 'flex';
        };

        window.saveUserEdit = async (uid) => {
            await updateDoc(doc(db, "users", uid), {
                balance: Number(document.getElementById('ed-bal').value),
                totalProfit: Number(document.getElementById('ed-prof').value),
                totalLoss: Number(document.getElementById('ed-loss').value)
            });
            alert("Updated!");
            document.getElementById('user-modal').style.display = 'none';
        };

        showTab('add');
    </script>
</body>
</html>

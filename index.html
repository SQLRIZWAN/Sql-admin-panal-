<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>SUPER ADMIN | BLACK GOLD</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root { 
            --gold: #FFD700; 
            --gold-dark: #b8860b;
            --bg: #000000; 
            --card: #121212; 
            --card-hover: #1a1a1a;
            --red: #cf0000; 
            --text-muted: #888; 
            --border: #333; 
            --input-bg: #080808;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding-top: 80px; 
            padding-bottom: 80px; 
            line-height: 1.5; 
        }
        
        /* HEADER - BLACK & GOLD */
        header { 
            background: rgba(0, 0, 0, 0.95); 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--gold-dark); 
            position: fixed; 
            top: 0; 
            left: 0;
            width: 100%;
            z-index: 1000; 
            backdrop-filter: blur(10px);
        }
        header h2 { margin: 0; font-size: 1.1rem; color: var(--gold); letter-spacing: 2px; font-weight: 900; text-transform: uppercase; }
        
        .menu-btn { font-size: 1.5rem; color: var(--gold); cursor: pointer; padding: 5px; }
        .menu-dropdown { position: absolute; top: 60px; right: 10px; background: #000; border: 1px solid var(--gold); border-radius: 0; width: 180px; display: none; flex-direction: column; box-shadow: 0 0 20px rgba(255, 215, 0, 0.1); z-index: 2000;}
        .menu-dropdown.show { display: flex; animation: fadeIn 0.2s ease; }
        .menu-item { padding: 15px; border-bottom: 1px solid #222; text-align: center; font-weight: bold; cursor: pointer; color: #ccc; transition:0.3s;}
        .menu-item:hover { background: var(--gold); color: #000; }
        .menu-item:last-child { border: none; color: var(--red); }

        @keyframes fadeIn { from {opacity:0; transform:translateY(-10px);} to {opacity:1; transform:translateY(0);} }

        .wrap { padding: 15px; max-width: 900px; margin: 0 auto; }
        
        /* NAV TABS */
        .nav-tabs { 
            display: flex; 
            gap: 8px; 
            overflow-x: auto; 
            padding-bottom: 5px; 
            margin-bottom: 20px; 
            scrollbar-width: none; 
        }
        .nav-tabs::-webkit-scrollbar { display: none; }
        
        .nav-btn { 
            flex: 0 0 auto;
            background: #0a0a0a; 
            color: #666; 
            border: 1px solid #222; 
            padding: 10px 16px; 
            border-radius: 4px; 
            text-align: center; 
            font-weight: 700; 
            font-size: 0.75rem; 
            transition: 0.3s; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .nav-btn.active { 
            background: var(--gold); 
            color: #000; 
            border-color: var(--gold); 
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); 
        }

        /* UPLOAD TAB SPECIAL STYLE */
        #tab-results.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .badge { background: var(--red); color: white; font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; display: none; margin-left:5px; }

        /* CARDS & INPUTS */
        .card { 
            background: var(--card); 
            padding: 20px; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
            margin-bottom: 20px; 
            position:relative; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }
        
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .field { display:flex; flex-direction:column; margin-bottom:15px; }
        
        label { font-size: 0.7rem; color:var(--text-muted); text-transform:uppercase; margin-bottom:6px; font-weight:700; letter-spacing: 1px; }
        
        input, select, textarea { 
            background: var(--input-bg); 
            border: 1px solid #333; 
            color: #fff; 
            padding: 12px; 
            border-radius: 4px; 
            font-size: 0.95rem; 
            width: 100%; 
            transition: 0.3s; 
            font-family: sans-serif; 
        }
        input:focus, select:focus, textarea:focus { 
            border-color: var(--gold); 
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.2); 
            background: #000;
        }

        /* BUTTONS */
        button { 
            padding: 14px; 
            border: none; 
            border-radius: 4px; 
            font-weight: 900; 
            cursor: pointer; 
            font-size: 0.9rem; 
            letter-spacing: 1px; 
            transition: 0.2s; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            text-transform: uppercase;
        }
        button:active { transform: scale(0.98); }
        
        .btn-gold { background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%); color: #000; width: 100%; }
        .btn-black { background: #000; color: var(--gold); border: 1px solid var(--gold); width: 100%; }
        .danger { background: var(--red); color: #fff; }
        .btn-copy { padding: 4px 8px; font-size: 0.65rem; background: #333; color: #fff; border-radius: 2px; margin-left: 10px; width: auto; }

        /* UPLOAD FILE INPUT STYLE */
        input[type="file"] {
            padding: 10px;
            background: #1a1a1a;
            border: 1px dashed var(--gold);
            cursor: pointer;
        }

        /* STATS */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { 
            background: #0a0a0a; 
            padding: 15px; 
            border-radius: 6px; 
            border: 1px solid #222; 
            text-align: center; 
        }
        .stat-num { font-size: 1.5rem; font-weight: 900; color: var(--gold); }
        .stat-label { font-size: 0.65rem; color: #666; text-transform: uppercase; margin-top: 5px; }

        /* TABLES & LISTS */
        .match-id-display { font-family: monospace; color: #555; font-size: 0.8rem; margin-top: 5px; display: flex; align-items: center; }

        .pay-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; background: #080808; padding: 10px; border-radius: 8px; border: 1px solid #222; }
        .p-btn { flex: 1 1 45%; padding: 10px 5px; background: #111; border: 1px solid #333; color: #777; border-radius: 4px; font-size: 0.7rem; font-weight: bold; cursor: pointer; }
        .p-btn.active { border-color: var(--gold); color: var(--gold); background: #1a1a00; }
        .p-btn-wide { flex: 1 1 100%; }

        .loading-spinner { text-align: center; padding: 20px; color: var(--gold); font-size: 0.9rem; }

        /* USER LIST */
        .user-row { display: flex; align-items: center; gap: 15px; padding: 15px; border-bottom: 1px solid #222; background: #080808; margin-bottom: 5px; border-radius: 4px;}
        .u-img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; }
        
        /* MODAL */
        .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:5000; display:none; align-items:center; justify-content:center; padding:20px; backdrop-filter: blur(5px); }
        .modal-box { background:#111; width:100%; max-width:500px; padding:25px; border-radius:10px; border: 1px solid var(--gold); overflow-y: auto; max-height: 90vh; }
        .pay-ss { width: 100%; max-height: 250px; object-fit: contain; border-radius: 4px; margin: 10px 0; background: #000; border: 1px solid #333; }
    </style>
</head>
<body>

    <header>
        <div>
            <h2>GOD MODE</h2>
            <small style="color:#666; font-size:0.7rem; letter-spacing:1px;">SUPER ADMIN v6.0</small>
        </div>
        
        <div style="position: relative;">
            <div class="menu-btn" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </div>
            <div id="admin-menu" class="menu-dropdown">
                <div class="menu-item" onclick="location.reload()">REFRESH</div>
                <div class="menu-item" onclick="logoutAdmin()">LOGOUT</div>
            </div>
        </div>
    </header>

    <div class="wrap">
        <div class="nav-tabs">
            <button class="nav-btn active" id="tab-dash" onclick="showTab('dash')"><i class="fa-solid fa-chart-line"></i> DASH</button>
            <button class="nav-btn" id="tab-add" onclick="showTab('add')"><i class="fa-solid fa-plus"></i> MATCH</button>
            <button class="nav-btn" id="tab-manage" onclick="showTab('manage')"><i class="fa-solid fa-list-check"></i> EDIT</button>
            
            <button class="nav-btn" id="tab-results" onclick="showTab('results')">
                <i class="fa-solid fa-trophy"></i> RESULT
            </button>
            
            <button class="nav-btn" id="tab-pay" onclick="showTab('pay')">
                <i class="fa-solid fa-wallet"></i> FINANCE <span id="pay-notif" class="badge">0</span>
            </button>
            <button class="nav-btn" id="tab-users" onclick="showTab('users')"><i class="fa-solid fa-users"></i> USERS</button>
        </div>

        <div id="view-dash" class="tab-content">
            <div class="card">
                <h3 style="color:var(--gold); margin-top:0; border-bottom:1px solid #333; padding-bottom:10px;">LIVE OVERVIEW</h3>
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-num" id="st-users">0</div>
                        <div class="stat-label">Total Users</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-num" id="st-bal">₹0</div>
                        <div class="stat-label">System Liability</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-num" id="st-matches">0</div>
                        <div class="stat-label">Total Matches</div>
                    </div>
                    <div class="stat-card" style="border-color:var(--red);">
                        <div class="stat-num" id="st-pending" style="color:var(--red);">0</div>
                        <div class="stat-label">Pending Req</div>
                    </div>
                </div>
                <button class="btn-black" onclick="loadDashboard()"><i class="fa-solid fa-rotate"></i> REFRESH DATA</button>
            </div>
        </div>

        <div id="view-add" class="tab-content" style="display:none;">
            <div class="card">
                <h3 style="color:var(--gold); margin:0 0 20px 0;">CREATE NEW MATCH</h3>
                <div class="grid-form">
                    <div class="field"><label>Map Name</label><input id="nm-map" value="Bermuda"></div>
                    <div class="field"><label>Type</label><input id="nm-type" value="Solo"></div>
                    <div class="field"><label>Entry Fee</label><input type="number" id="nm-fee" value="10"></div>
                    <div class="field"><label>Per Kill / Win</label><input type="number" id="nm-win" value="100"></div>
                    <div class="field"><label>Total Slots</label><input type="number" id="nm-slots" value="48"></div>
                    <div class="field"><label>Fake Join</label><input type="number" id="nm-fake" value="0"></div>
                </div>
                <div class="field"><label>Start Date & Time</label><input type="datetime-local" id="nm-time"></div>
                <button class="btn-gold" onclick="createMatch()">LAUNCH MATCH <i class="fa-solid fa-rocket"></i></button>
            </div>
        </div>

        <div id="view-manage" class="tab-content" style="display:none;">
            <div id="match-list"><div class="loading-spinner">Loading Matches...</div></div>
        </div>

        <div id="view-results" class="tab-content" style="display:none;">
            <div class="card" style="border: 1px solid var(--gold);">
                <h3 style="color:var(--gold); text-align:center; margin-top:0;">PUBLISH RESULT</h3>
                
                <div class="field">
                    <label style="color:#fff;">MATCH ID (PASTE HERE)</label>
                    <input type="text" id="res-mid" placeholder="Paste Match ID..." style="border-color:#555; text-align:center; font-family:monospace;">
                </div>

                <div class="field">
                    <label>Winner Name</label>
                    <input type="text" id="res-name" placeholder="Name of Winner">
                </div>

                <div class="grid-form">
                    <div class="field">
                        <label style="color:var(--gold);">Winner Phone</label>
                        <input type="number" id="res-uid" placeholder="Reg. Phone Number">
                    </div>
                    <div class="field">
                        <label style="color:var(--gold);">Prize Amount (₹)</label>
                        <input type="number" id="res-amt" placeholder="Winning Amount">
                    </div>
                </div>

                <div class="grid-form">
                    <div class="field">
                        <label>Winner In-Game UID</label>
                        <input type="text" id="res-guid" placeholder="Ex: 12345678">
                    </div>
                    <div class="field">
                        <label>Opponent UID (Optional)</label>
                        <input type="text" id="res-op-uid" placeholder="Runner up ID">
                    </div>
                </div>

                <div class="field">
                    <label style="color:#fff;"><i class="fa-solid fa-image"></i> Upload Result Screenshot</label>
                    <input type="file" id="res-file" accept="image/*">
                    <small style="color:#666; margin-top:5px;">Select screenshot from gallery</small>
                </div>

                <button class="btn-gold" id="btn-pub-res" onclick="publishResultLogic()">
                    <i class="fa-solid fa-check-circle"></i> UPLOAD & DISTRIBUTE MONEY
                </button>

                <p style="font-size:0.7rem; color:#666; text-align:center; margin-top:15px;">
                    <i class="fa-solid fa-triangle-exclamation"></i> Action cannot be undone. Money will be added instantly.
                </p>
            </div>
        </div>

        <div id="view-pay" class="tab-content" style="display:none;">
            <div class="pay-tabs">
                <button class="p-btn active" id="pb-fund" onclick="setPayView('fund')">DEPOSIT (REQ)</button>
                <button class="p-btn" id="pb-draw" onclick="setPayView('draw')">WITHDRAW (REQ)</button>
                <button class="p-btn" id="pb-fund-h" onclick="setPayView('fund-h')">DEP. HISTORY</button>
                <button class="p-btn" id="pb-draw-h" onclick="setPayView('draw-h')">W/D HISTORY</button>
                <button class="p-btn p-btn-wide" id="pb-join" onclick="setPayView('join')">MATCH JOINS</button>
            </div>
            
            <div style="margin-bottom:10px; display:flex; justify-content:flex-end;">
                <button onclick="loadPayments()" style="padding:5px 10px; font-size:0.7rem; background:#222; color:#fff; width:auto;">Refresh List</button>
            </div>
            
            <div id="pay-list-container"></div>
        </div>

        <div id="view-users" class="tab-content" style="display:none;">
            <div class="card" style="text-align:center;">
                <h2 id="total-users" style="color:var(--gold); margin:0; font-size:2.5rem;">0</h2>
                <label>Registered Gamers</label>
                <input type="text" id="user-search" placeholder="Search user..." oninput="loadUsers(this.value)" style="margin-top:15px; text-align:center;">
            </div>
            <div id="users-list"></div>
        </div>
    </div>

    <div id="user-modal" class="modal">
        <div class="modal-box">
            <h3 style="color:var(--gold); text-align:center; margin-top:0;">USER MANAGER</h3>
            <div id="user-details-content"></div>
            <button class="danger" style="width:100%; margin-top:15px;" onclick="document.getElementById('user-modal').style.display='none'">CLOSE</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, query, orderBy, getDoc, increment, where, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // CONFIG (Replace if needed, but using yours)
        const firebaseConfig = {
            apiKey: "AIzaSyBvObxADcAior6R_or9O6UmWsFT8do1GkI",
            authDomain: "sqladmin-ff04d.firebaseapp.com",
            projectId: "sqladmin-ff04d",
            storageBucket: "sqladmin-ff04d.firebasestorage.app", // Ensure this is enabled in console
            messagingSenderId: "539086978850",
            appId: "1:539086978850:web:261e6a0cf3c9a2aa29ef7b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);

        // --- GLOBAL HELPER ---
        window.copyToClip = (text) => {
            navigator.clipboard.writeText(text);
            alert("Copied!");
        };

        let currentPayTab = 'fund';

        // MENU
        window.toggleMenu = () => { document.getElementById('admin-menu').classList.toggle('show'); };
        window.logoutAdmin = () => { if(confirm('Logout?')) signOut(auth).then(() => location.reload()); };

        window.showTab = (tab) => {
            document.querySelectorAll('.tab-content').forEach(v => v.style.display = 'none');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view-'+tab).style.display = 'block';
            document.getElementById('tab-'+tab).classList.add('active');
            
            if(tab === 'dash') loadDashboard();
            if(tab === 'manage') loadMatches();
            if(tab === 'pay') setPayView(currentPayTab);
            if(tab === 'users') loadUsers();
            
            document.getElementById('admin-menu').classList.remove('show');
        };

        // --- DASHBOARD FIX (Live Pending Count) ---
        window.loadDashboard = async () => {
            // Users Count & Balance
            onSnapshot(collection(db, "users"), snap => {
                let uCount = snap.size;
                let totBal = 0;
                snap.forEach(d => { totBal += (d.data().balance || 0) });
                document.getElementById('st-users').innerText = uCount;
                document.getElementById('st-bal').innerText = "₹" + totBal.toLocaleString();
            });
            // Matches Count
            onSnapshot(collection(db, "matches"), snap => {
                document.getElementById('st-matches').innerText = snap.size;
            });

            // FIXED: Pending Requests Calculation (Separate Listeners)
            let pendingDep = 0;
            let pendingWd = 0;
            
            const qDep = query(collection(db, "payments"), where("status", "==", "pending"));
            onSnapshot(qDep, (snap) => {
                pendingDep = snap.size;
                updatePendingTotal();
            });

            const qWd = query(collection(db, "withdrawals"), where("status", "==", "pending"));
            onSnapshot(qWd, (snap) => {
                pendingWd = snap.size;
                updatePendingTotal();
            });

            function updatePendingTotal() {
                const total = pendingDep + pendingWd;
                const el = document.getElementById('st-pending');
                const badge = document.getElementById('pay-notif');
                el.innerText = total;
                if(total > 0) { badge.innerText = total; badge.style.display='inline-block'; }
                else { badge.style.display='none'; }
            }
        };

        // --- MATCHES ---
        window.createMatch = async () => {
            const btn = document.querySelector('#view-add .btn-gold');
            btn.innerText = "Processing...";
            try {
                const data = {
                    map: document.getElementById('nm-map').value,
                    type: document.getElementById('nm-type').value,
                    entry: Number(document.getElementById('nm-fee').value),
                    win: Number(document.getElementById('nm-win').value),
                    total: Number(document.getElementById('nm-slots').value),
                    joined: Number(document.getElementById('nm-fake').value),
                    startTime: new Date(document.getElementById('nm-time').value).getTime(),
                    status: 'open', roomId: '', password: '',
                    createdAt: Date.now()
                };
                await addDoc(collection(db, "matches"), data);
                alert("Match Created!");
                showTab('manage');
            } catch(e) { alert("Error: " + e.message); }
            btn.innerHTML = 'LAUNCH MATCH <i class="fa-solid fa-rocket"></i>';
        };

        function loadMatches() {
            onSnapshot(query(collection(db, "matches"), orderBy("startTime", "desc")), snap => {
                const list = document.getElementById('match-list');
                list.innerHTML = "";
                if(snap.empty) { list.innerHTML = "<div class='loading-spinner'>No Matches Found</div>"; return; }
                
                snap.forEach(d => {
                    const m = d.data();
                    const id = d.id;
                    const dateObj = new Date(m.startTime);
                    const offset = dateObj.getTimezoneOffset() * 60000;
                    const localISOTime = new Date(dateObj.getTime() - offset).toISOString().slice(0, 16);

                    // Color Logic for Status
                    let borderCol = "var(--gold)";
                    if(m.status === 'started') borderCol = "#00ff00";
                    if(m.status === 'finished') borderCol = "#333";

                    list.innerHTML += `
                    <div class="card" style="border-left: 4px solid ${borderCol}">
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                            <span style="color:var(--gold); font-weight:bold;">${m.map} <small style="color:#666">(${m.type})</small></span>
                            <span style="font-size:0.7rem; background:#222; padding:3px 8px; border-radius:4px;">${m.status.toUpperCase()}</span>
                        </div>
                        
                        <div class="match-id-display">
                            ID: ${id} <button class="btn-copy" onclick="copyToClip('${id}')">COPY</button>
                        </div>
                        <hr style="border-color:#222; margin:15px 0;">

                        <div class="grid-form">
                            <div class="field"><label>Map</label><input id="m-map-${id}" value="${m.map}"></div>
                            <div class="field"><label>Time</label><input type="datetime-local" id="m-time-${id}" value="${localISOTime}"></div>
                            <div class="field"><label>Slots</label><input type="number" id="m-tot-${id}" value="${m.total}"></div>
                            <div class="field"><label>Joined</label><input type="number" id="m-join-${id}" value="${m.joined}"></div>
                        </div>

                        <div class="field"><label>Room Details</label>
                            <div style="display:flex; gap:10px;">
                                <input id="m-rid-${id}" value="${m.roomId||''}" placeholder="ID" style="color:var(--gold)">
                                <input id="m-pas-${id}" value="${m.password||''}" placeholder="PASS" style="color:var(--gold)">
                            </div>
                        </div>

                        <div class="field"><label>Match Status</label>
                            <select id="m-st-${id}">
                                <option value="open" ${m.status=='open'?'selected':''}>Open (Joinable)</option>
                                <option value="started" ${m.status=='started'?'selected':''}>Started (Live)</option>
                                <option value="finished" ${m.status=='finished'?'selected':''}>Finished (Completed)</option>
                            </select>
                        </div>
                        
                        <div style="display:flex; gap:10px;">
                            <button class="btn-black" onclick="updateMatch('${id}')"><i class="fa-solid fa-save"></i> UPDATE</button>
                            <button class="danger" style="width:50px;" onclick="delMatch('${id}')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>`;
                });
            });
        }
        window.updateMatch = async (id) => {
            try {
                await updateDoc(doc(db,"matches",id), {
                    map: document.getElementById('m-map-'+id).value,
                    startTime: new Date(document.getElementById('m-time-'+id).value).getTime(),
                    total: Number(document.getElementById('m-tot-'+id).value),
                    joined: Number(document.getElementById('m-join-'+id).value),
                    roomId: document.getElementById('m-rid-'+id).value,
                    password: document.getElementById('m-pas-'+id).value,
                    status: document.getElementById('m-st-'+id).value
                });
                alert("Match Updated!");
            } catch(e) { alert("Error: " + e.message); }
        };
        window.delMatch = async(id) => { if(confirm("Delete permanently?")) await deleteDoc(doc(db,"matches",id)); };

        // --- RESULT LOGIC WITH FILE UPLOAD ---
        window.publishResultLogic = async () => {
            const mid = document.getElementById('res-mid').value.trim();
            const wName = document.getElementById('res-name').value;
            const wUid = document.getElementById('res-uid').value.trim(); 
            const wAmt = Number(document.getElementById('res-amt').value);
            const wGid = document.getElementById('res-guid').value;
            const opUid = document.getElementById('res-op-uid').value;
            const fileInput = document.getElementById('res-file');
            
            if(!mid || !wName || !wUid || wAmt <= 0) return alert("Please fill all required fields!");

            const conf = confirm(`CONFIRM?\n\nWinner: ${wName}\nAmount: ₹${wAmt}\n\nMoney will be sent immediately.`);
            if(!conf) return;

            const btn = document.getElementById('btn-pub-res');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading Image...';
            btn.disabled = true;

            try {
                let imgUrl = "";
                
                // 1. Upload Image if selected
                if(fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const storageRef = ref(storage, 'results/' + mid + '_' + Date.now());
                    await uploadBytes(storageRef, file);
                    imgUrl = await getDownloadURL(storageRef);
                }

                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Updating Wallet...';

                // 2. Transaction
                await runTransaction(db, async (transaction) => {
                    const matchRef = doc(db, "matches", mid);
                    const userRef = doc(db, "users", wUid);

                    const matchSnap = await transaction.get(matchRef);
                    if(!matchSnap.exists()) throw "Invalid Match ID!";
                    
                    const userSnap = await transaction.get(userRef);
                    if(!userSnap.exists()) throw "User not found (Check Phone)!";

                    const newBal = (userSnap.data().balance || 0) + wAmt;
                    const newProfit = (userSnap.data().totalProfit || 0) + wAmt;

                    transaction.update(matchRef, {
                        status: 'finished',
                        winnerName: wName,
                        winnerUid: wUid,
                        winnerGamingUid: wGid,
                        winnerPrize: wAmt,
                        opponentUid: opUid,
                        resultImage: imgUrl, // Store the URL from storage
                        resultPublished: true
                    });

                    transaction.update(userRef, {
                        balance: newBal,
                        totalProfit: newProfit
                    });

                    const payRef = doc(collection(db, "payments"));
                    transaction.set(payRef, {
                        userId: wUid,
                        userName: userSnap.data().name,
                        amount: wAmt,
                        type: 'winnings',
                        status: 'approved',
                        matchId: mid,
                        note: 'Match Winner Prize',
                        timestamp: Date.now()
                    });
                });

                alert("SUCCESS! Money Sent.");
                // Clear form
                document.getElementById('res-mid').value = '';
                document.getElementById('res-file').value = ''; 
            } catch(e) {
                console.error(e);
                alert("FAILED: " + e);
            }
            btn.innerHTML = originalText;
            btn.disabled = false;
        };


        // --- PAYMENTS & HISTORY ---
        window.setPayView = (v) => {
            currentPayTab = v;
            document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active'));
            const mapping = {'fund':'pb-fund', 'fund-h':'pb-fund-h', 'draw':'pb-draw', 'draw-h':'pb-draw-h', 'join':'pb-join'};
            if(document.getElementById(mapping[v])) document.getElementById(mapping[v]).classList.add('active');
            loadPayments();
        };

        function loadPayments() {
            const container = document.getElementById('pay-list-container');
            container.innerHTML = "<div class='loading-spinner'>Loading Data...</div>";

            let col = "payments";
            if(currentPayTab.includes('draw')) col = "withdrawals";
            
            onSnapshot(query(collection(db, col), orderBy("timestamp", "desc")), snap => {
                container.innerHTML = "";
                let visibleCount = 0;

                snap.forEach(d => {
                    const p = d.data();
                    const id = d.id;
                    const isPending = p.status === 'pending';
                    const isMatchPay = p.matchId && p.matchId !== 'ADD_FUND' && p.matchId !== '';
                    
                    let show = false;
                    // Logic to filter tabs strictly
                    if(currentPayTab === 'fund' && col === 'payments' && isPending && !isMatchPay) show = true;
                    if(currentPayTab === 'draw' && col === 'withdrawals' && isPending) show = true;
                    if(currentPayTab === 'fund-h' && col === 'payments' && !isPending && !isMatchPay) show = true;
                    if(currentPayTab === 'draw-h' && col === 'withdrawals' && !isPending) show = true;
                    if(currentPayTab === 'join' && col === 'payments' && isMatchPay) show = true;

                    if(show) {
                        visibleCount++;
                        const timeStr = p.timestamp ? new Date(p.timestamp).toLocaleString() : 'N/A';
                        
                        container.innerHTML += `
                        <div class="card" style="border-left: 4px solid ${isPending ? 'var(--red)' : 'var(--gold)'}; padding:15px;">
                            <div style="display:flex; justify-content:space-between;">
                                <div>
                                    <div style="font-weight:bold; color:#fff;">${p.userName || 'User'}</div>
                                    <div style="font-size:0.7rem; color:#666;">${timeStr}</div>
                                </div>
                                <span style="font-size:0.7rem; font-weight:bold; color:${isPending?'var(--red)':'var(--gold)'}">${p.status.toUpperCase()}</span>
                            </div>
                            
                            <div style="background:#000; padding:10px; border-radius:4px; margin:10px 0; border:1px solid #222;">
                                <div style="font-size:0.9rem;">Amount: <b style="color:#fff; font-size:1.1rem;">₹${p.amount}</b></div>
                                <div style="font-size:0.75rem; color:#888;">${p.utr ? 'UTR: '+p.utr : (p.upi || p.type)}</div>
                                ${p.matchId ? `<div style="font-size:0.75rem; color:var(--gold);">MID: ${p.matchId}</div>` : ''}
                            </div>
                            
                            ${p.ss ? `<img src="${p.ss}" class="pay-ss" onclick="window.open('${p.ss}')">` : ''}
                            
                            ${isPending ? `
                                <div style="display:flex; gap:10px; margin-top:10px;">
                                    <button onclick="approveReq('${id}','${col}','${p.userId}','${p.amount}')" class="btn-gold" style="font-size:0.8rem; padding:10px;">APPROVE</button>
                                    <button onclick="rejectReq('${id}','${col}','${p.userId}','${p.amount}')" class="danger" style="font-size:0.8rem; padding:10px;">REJECT</button>
                                </div>
                            ` : ''}
                            <button onclick="viewFullUser('${p.userId}')" style="width:100%; margin-top:10px; background:transparent; border:1px solid #333; color:#666; font-size:0.65rem; padding:6px;">VIEW PROFILE</button>
                        </div>`;
                    }
                });
                
                if(visibleCount === 0) container.innerHTML = `<div style='text-align:center; padding:30px; color:#444;'>No data in this section.</div>`;
            });
        }

        window.approveReq = async (id, col, uid, amt) => {
            if(!confirm("Approve and update balance?")) return;
            try {
                await updateDoc(doc(db, col, id), { status: 'approved' });
                if(col === 'payments') {
                    await updateDoc(doc(db, "users", uid), { balance: increment(Number(amt)) });
                }
                alert("Done!");
            } catch(e) { alert(e.message); }
        };

        window.rejectReq = async (id, col, uid, amt) => {
            const reason = prompt("Reject Reason:", "Invalid Info");
            if(!reason) return; 
            try {
                await updateDoc(doc(db, col, id), { status: 'rejected', note: reason });
                if(col === 'withdrawals') {
                    await updateDoc(doc(db, "users", uid), { balance: increment(Number(amt)) });
                }
                alert("Rejected.");
            } catch(e) { alert(e.message); }
        };

        // --- USERS ---
        window.loadUsers = (search = "") => {
            onSnapshot(collection(db, "users"), snap => {
                document.getElementById('total-users').innerText = snap.size;
                const list = document.getElementById('users-list');
                list.innerHTML = "";
                
                let count = 0;
                snap.forEach(d => {
                    const u = d.data();
                    const s = search.toLowerCase();
                    if(search && !u.name.toLowerCase().includes(s) && !d.id.includes(s) && !(u.phone && u.phone.includes(s))) return;
                    if(!search && count > 50) return; // Limit list
                    count++;

                    list.innerHTML += `
                    <div class="user-row" onclick="viewFullUser('${d.id}')">
                        <img src="${u.dpUrl || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="u-img">
                        <div style="flex:1;">
                            <div style="font-weight:bold; color:#fff; font-size:0.9rem;">${u.name}</div>
                            <div style="font-size:0.7rem; color:#666;">${u.phone || d.id}</div>
                        </div>
                        <div style="text-align:right;">
                            <div style="color:${u.balance > 0 ? 'var(--gold)' : '#fff'}; font-weight:bold;">₹${u.balance}</div>
                        </div>
                    </div>`;
                });
            });
        };

        window.viewFullUser = async (uid) => {
            const snap = await getDoc(doc(db, "users", uid));
            if(!snap.exists()) return alert("User not found");
            const u = snap.data();
            const content = document.getElementById('user-details-content');
            
            content.innerHTML = `
                <div style="text-align:center; margin-bottom:20px;">
                    <img src="${u.dpUrl || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" style="width:80px; height:80px; border-radius:50%; border:2px solid var(--gold);">
                    <h3 style="margin:10px 0 0 0; color:#fff;">${u.name}</h3>
                    <div style="color:#666; font-size:0.75rem; margin-bottom:5px;">ID: ${uid} <button class="btn-copy" onclick="copyToClip('${uid}')">COPY</button></div>
                    <div style="color:#888; font-size:0.75rem;">${u.email || ''} | ${u.phone || ''}</div>
                </div>
                
                <div class="card" style="padding:15px; margin-bottom:10px;">
                    <h5 style="margin:0 0 10px 0; color:var(--gold);">WALLET</h5>
                    <div class="field"><label>Balance (₹)</label><input type="number" id="ed-bal" value="${u.balance}"></div>
                    <div class="grid-form">
                        <div class="field"><label>Won</label><input type="number" id="ed-prof" value="${u.totalProfit||0}"></div>
                        <div class="field"><label>Lost</label><input type="number" id="ed-loss" value="${u.totalLoss||0}"></div>
                    </div>
                </div>

                <div class="card" style="padding:15px;">
                    <h5 style="margin:0 0 10px 0; color:var(--gold);">GAME INFO</h5>
                    <div class="field"><label>IGN</label><input id="ed-gname" value="${u.gamingName||''}"></div>
                    <div class="field"><label>UID</label><input id="ed-guid" value="${u.gamingId||''}"></div>
                </div>

                <button class="btn-gold" onclick="saveUserEdit('${uid}')">SAVE CHANGES</button>
            `;
            document.getElementById('user-modal').style.display = 'flex';
        };

        window.saveUserEdit = async (uid) => {
            if(!confirm("Save user changes?")) return;
            await updateDoc(doc(db, "users", uid), {
                balance: Number(document.getElementById('ed-bal').value),
                totalProfit: Number(document.getElementById('ed-prof').value),
                totalLoss: Number(document.getElementById('ed-loss').value),
                gamingName: document.getElementById('ed-gname').value,
                gamingId: document.getElementById('ed-guid').value
            });
            alert("Updated!");
            document.getElementById('user-modal').style.display = 'none';
        };

        // --- INIT ---
        showTab('dash'); 
    </script>
</body>
                </html>

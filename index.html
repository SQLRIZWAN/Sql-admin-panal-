<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SQL Admin Panel – FINAL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBvObxADcAior6R_or9O6UmWsFT8do1GkI",
      authDomain: "sqladmin-ff04d.firebaseapp.com",
      projectId: "sqladmin-ff04d",
      storageBucket: "sqladmin-ff04d.firebasestorage.app",
      messagingSenderId: "539086978850",
      appId: "1:539086978850:web:261e6a0cf3c9a2aa29ef7b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // -------- AUTH --------
    window.loginAdmin = async () => {
      try {
        await signInWithEmailAndPassword(auth, email.value, pass.value);
      } catch {
        alert('Wrong email or password');
      }
    };

    window.logout = async () => {
      await signOut(auth);
    };

    onAuthStateChanged(auth, u => {
      login.style.display = u ? 'none' : 'block';
      panel.style.display = u ? 'block' : 'none';
      if (u) {
        showMatches();
        loadMatches();
      }
    });

    // -------- MENU --------
    window.toggleMenu = () => menu.style.display = 'block';
    window.closeMenu = () => menu.style.display = 'none';

    window.showMatches = () => {
      matchesPage.style.display = 'block';
      paymentsPage.style.display = 'none';
      closeMenu();
    };

    window.showPayments = () => {
      matchesPage.style.display = 'none';
      paymentsPage.style.display = 'block';
      loadPayments();
      closeMenu();
    };

    // -------- MATCHES --------
    async function loadMatches() {
      matches.innerHTML = '';
      const snap = await getDocs(collection(db, 'matches'));
      snap.forEach(d => {
        const m = d.data();
        matches.innerHTML += `
          <div class="card">
            <h3>${m.type}</h3>
            Entry <input id="e-${d.id}" value="${m.entry}" />
            Win <input id="w-${d.id}" value="${m.win}" />
            Status <input id="s-${d.id}" value="${m.status}" />
            Room ID <input id="r-${d.id}" value="${m.roomId || ''}" />
            Password <input id="p-${d.id}" value="${m.password || ''}" />
            <button onclick="saveMatch('${d.id}')">Update Match</button>
          </div>`;
      });
    }

    window.saveMatch = async id => {
      await updateDoc(doc(db, 'matches', id), {
        entry: Number(document.getElementById('e-'+id).value),
        win: Number(document.getElementById('w-'+id).value),
        status: document.getElementById('s-'+id).value,
        roomId: document.getElementById('r-'+id).value,
        password: document.getElementById('p-'+id).value
      });
      alert('Match updated');
    };

    // -------- PAYMENTS --------
    async function loadPayments() {
      payments.innerHTML = '';
      const snap = await getDocs(collection(db, 'payments'));
      snap.forEach(d => {
        const p = d.data();
        payments.innerHTML += `
          <div class="card">
            <b>Match:</b> ${p.matchId || ''}<br>
            <b>Amount:</b> ₹${p.amount}<br>
            <b>UTR:</b> ${p.txid}<br>
            <b>Status:</b> ${p.status}<br>
            <button onclick="approve('${d.id}')">Approve</button>
            <button class="danger" onclick="reject('${d.id}')">Reject</button>
          </div>`;
      });
    }

    window.approve = async id => {
      await updateDoc(doc(db, 'payments', id), { status: 'approved' });
      alert('Payment approved');
      loadPayments();
    };

    window.reject = async id => {
      await updateDoc(doc(db, 'payments', id), { status: 'rejected' });
      alert('Payment rejected');
      loadPayments();
    };
  </script>  <style>
    body { background:#0b0b0b; color:#fff; font-family:Arial; margin:0 }
    .top { display:flex; justify-content:space-between; padding:15px; background:#000 }
    .menuBtn { cursor:pointer; font-size:22px }
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6) }
    .menuBox { position:absolute; right:0; top:0; background:#111; width:200px; height:100%; padding:20px }
    .menuBox button { width:100%; margin-bottom:10px }
    .wrap { padding:20px }
    .card { background:#111; padding:15px; border-radius:12px; margin-bottom:15px }
    input { width:100%; margin:5px 0; padding:8px; background:#000; color:#0f0; border:1px solid #333 }
    button { padding:8px; background:#00ff88; border:none; font-weight:bold; border-radius:6px }
    .danger { background:red; color:#fff }
  </style></head>
<body><div id="login" class="wrap">
  <h2>Admin Login</h2>
  <input id="email" placeholder="Email" />
  <input id="pass" type="password" placeholder="Password" />
  <button onclick="loginAdmin()">Login</button>
</div><div id="panel" style="display:none">
  <div class="top">
    <h3>Admin Panel</h3>
    <div class="menuBtn" onclick="toggleMenu()">☰</div>
  </div>  <div id="menu" class="overlay" onclick="closeMenu()">
    <div class="menuBox" onclick="event.stopPropagation()">
      <button onclick="showMatches()">Matches</button>
      <button onclick="showPayments()">Payments</button>
      <button class="danger" onclick="logout()">Logout</button>
    </div>
  </div>  <div id="matchesPage">
    <div id="matches" class="wrap"></div>
  </div>  <div id="paymentsPage" style="display:none">
    <div id="payments" class="wrap"></div>
  </div>
</div></body>
</html>

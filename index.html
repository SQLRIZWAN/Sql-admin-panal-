<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SQL Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <!-- Firebase SDKs -->  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 🔐 Firebase Config (YOUR PROJECT)
    const firebaseConfig = {
      apiKey: "AIzaSyBvObxADcAior6R_or9O6UmWsFT8do1GkI",
      authDomain: "sqladmin-ff04d.firebaseapp.com",
      projectId: "sqladmin-ff04d",
      storageBucket: "sqladmin-ff04d.firebasestorage.app",
      messagingSenderId: "539086978850",
      appId: "1:539086978850:web:261e6a0cf3c9a2aa29ef7b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ---------- AUTH ----------
    window.loginAdmin = async () => {
      try {
        await signInWithEmailAndPassword(auth, email.value, password.value);
      } catch {
        alert("Wrong email or password");
      }
    };

    window.logout = async () => signOut(auth);

    onAuthStateChanged(auth, user => {
      if (user) {
        loginBox.style.display = 'none';
        panel.style.display = 'block';
        loadPayments();
        loadMatches();
      } else {
        loginBox.style.display = 'block';
        panel.style.display = 'none';
      }
    });

    // ---------- PAYMENTS ----------
    async function loadPayments() {
      payments.innerHTML = "";
      const snap = await getDocs(collection(db, "payments"));
      snap.forEach(d => {
        const p = d.data();
        payments.innerHTML += `
          <div class="card">
            <b>₹${p.amount}</b> | ${p.matchId}<br>
            TXID: ${p.txid}<br>
            Status: ${p.status}<br>
            <button onclick="approvePay('${d.id}')">Approve</button>
            <button onclick="rejectPay('${d.id}')">Reject</button>
          </div>`;
      });
    }

    window.approvePay = async id => {
      await updateDoc(doc(db, "payments", id), { status: "approved" });
      loadPayments();
    };

    window.rejectPay = async id => {
      await updateDoc(doc(db, "payments", id), { status: "rejected" });
      loadPayments();
    };

    // ---------- MATCHES ----------
    async function loadMatches() {
      matches.innerHTML = "";
      const snap = await getDocs(collection(db, "matches"));
      snap.forEach(d => {
        const m = d.data();
        matches.innerHTML += `
          <div class="card">
            <h3>${m.type}</h3>
            <small>Players: ${m.approvedPlayers || 0} / ${m.maxPlayers}</small><br><br>

            Entry ₹<input id="e-${d.id}" value="${m.entry}" />
            Win ₹<input id="w-${d.id}" value="${m.win}" />

            Room ID<input id="r-${d.id}" value="${m.roomId || ''}" />
            Password<input id="p-${d.id}" value="${m.password || ''}" />

            Status
            <select id="s-${d.id}">
              <option ${m.status==='waiting'?'selected':''}>waiting</option>
              <option ${m.status==='upcoming'?'selected':''}>upcoming</option>
              <option ${m.status==='live'?'selected':''}>live</option>
              <option ${m.status==='completed'?'selected':''}>completed</option>
            </select>

            Join Enabled
            <select id="j-${d.id}">
              <option value="true" ${m.joinEnabled?'selected':''}>ON</option>
              <option value="false" ${!m.joinEnabled?'selected':''}>OFF</option>
            </select>

            <button onclick="saveMatch('${d.id}')">Save</button>
          </div>`;
      });
    }

    window.saveMatch = async id => {
      await updateDoc(doc(db, "matches", id), {
        entry: Number(document.getElementById('e-'+id).value),
        win: Number(document.getElementById('w-'+id).value),
        roomId: document.getElementById('r-'+id).value,
        password: document.getElementById('p-'+id).value,
        status: document.getElementById('s-'+id).value,
        joinEnabled: document.getElementById('j-'+id).value === 'true'
      });
      alert("Match updated");
    };

  </script>  <style>
    body { margin:0; background:#0b0b0b; color:#fff; font-family:Arial }
    input,select { width:100%; padding:8px; margin:6px 0; background:#000; color:#0f0; border:1px solid #333 }
    button { padding:8px 12px; margin-top:8px; background:#00ff88; border:none; font-weight:bold; cursor:pointer }
    .wrap { padding:20px }
    .card { background:#111; padding:15px; margin:15px 0; border-radius:12px; border:1px solid #333 }
    h2 { color:#00ff88 }
    nav button { margin-right:10px }
  </style></head>
<body><div id="loginBox" class="wrap" style="margin-top:60px; text-align:center">
  <h2>Admin Login</h2>
  <input id="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />
  <button onclick="loginAdmin()">LOGIN</button>
</div><div id="panel" class="wrap" style="display:none">
  <nav>
    <button onclick="loadPayments()">Payments</button>
    <button onclick="loadMatches()">Matches</button>
    <button onclick="logout()">Logout</button>
  </nav>  <h2>Payments</h2>
  <div id="payments"></div>  <h2>Matches</h2>
  <div id="matches"></div>
</div></body>
</html>
